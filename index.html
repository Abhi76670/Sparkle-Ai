      function BuildMarkdownView({ text, isThought = false }) {
        const normalized = useMemo(() => {
          return String(text || '')
            .replace(/`?<project_name>[\s\S]*?<\/project_name>`?/gi, '')
            .replace(/```(\*\*|[A-Za-z])/g, (match, after, offset, full) => {
              const before = full.slice(0, offset);
              const fenceCount = (before.match(/```/g) || []).length;
              if (fenceCount % 2 === 1 && after === '**') {
                return '```\n\n**';
              }
              return match;
            })
            .replace(/([^\n])(\*\*[A-Z][^*\n]{3,60}\*\*)/g, '$1\n\n$2');
        }, [text]);

        const segments = useMemo(() => {
          const out = [];
          const fenceRe = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)(?:```|$)/g;
          let last = 0;
          let m;
          while ((m = fenceRe.exec(normalized)) !== null) {
            if (m.index > last) {
              out.push({ type: 'prose', content: normalized.slice(last, m.index) });
            }
            out.push({
              type: 'code',
              lang: (m[1] || 'code').trim().toLowerCase(),
              content: m[2].replace(/\n$/, ''),
            });
            last = m.index + m[0].length;
          }
          if (last < normalized.length) {
            out.push({ type: 'prose', content: normalized.slice(last) });
          }
          return out;
        }, [normalized]);

        const renderProse = (prose, keyPrefix) => {
          const lines = prose.split('\n');
          const els = [];
          let i = 0;
          const textColor = isThought ? '#a1a1aa' : '#e6e6e6';

          while (i < lines.length) {
            const rawLine = lines[i];
            const trimmed = rawLine.trim();
            if (!trimmed) {
              i++;
              continue;
            }

            if (/^(?:---+|\*\*\*+|___+)$/.test(trimmed)) {
              els.push(
                <hr
                  key={`${keyPrefix}-hr-${i}`}
                  style={{
                    border: 'none',
                    borderTop: '1px solid #2a2a2a',
                    margin: '8px 0',
                  }}
                />
              );
              i++;
              continue;
            }

            if (/^#{1,4}\s+/.test(trimmed)) {
              const level = (trimmed.match(/^#+/) || [''])[0].length;
              const fontSize = level === 1 ? 17 : level === 2 ? 15.5 : 14.5;
              els.push(
                <div
                  key={`${keyPrefix}-h-${i}`}
                  style={{
                    fontSize,
                    fontWeight: 700,
                    color: '#ffffff',
                    marginTop: 10,
                    marginBottom: 4,
                    lineHeight: 1.4,
                  }}
                >
                  {renderInlineFormatting(trimmed.replace(/^#{1,4}\s+/, ''))}
                </div>
              );
              i++;
              continue;
            }

            if (/^[-*•]\s+/.test(trimmed)) {
              const items = [];
              while (i < lines.length && /^[-*•]\s+/.test(lines[i].trim())) {
                items.push(lines[i].trim().replace(/^[-*•]\s+/, ''));
                i++;
              }
              els.push(
                <ul
                  key={`${keyPrefix}-ul-${i}`}
                  style={{
                    paddingLeft: 18,
                    margin: '6px 0',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: 4,
                  }}
                >
                  {items.map((it, idx) => (
                    <li key={idx} style={{ color: textColor, lineHeight: 1.55 }}>
                      {renderInlineFormatting(it)}
                    </li>
                  ))}
                </ul>
              );
              continue;
            }

            if (/^\d+\.\s+/.test(trimmed)) {
              const items = [];
              while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
                items.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
                i++;
              }
              els.push(
                <ol
                  key={`${keyPrefix}-ol-${i}`}
                  style={{
                    paddingLeft: 20,
                    margin: '6px 0',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: 5,
                  }}
                >
                  {items.map((it, idx) => (
                    <li key={idx} style={{ color: textColor, lineHeight: 1.55 }}>
                      {renderInlineFormatting(it)}
                    </li>
                  ))}
                </ol>
              );
              continue;
            }

            els.push(
              <div
                key={`${keyPrefix}-p-${i}`}
                style={{ color: textColor, lineHeight: 1.6, margin: '3px 0' }}
              >
                {renderInlineFormatting(rawLine)}
              </div>
            );
            i++;
          }
          return els;
        };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, whiteSpace: 'normal' }}>
            {segments.map((seg, idx) => {
              if (seg.type === 'code') {
                return <BuildCompactCodeCard key={idx} lang={seg.lang} content={seg.content} />;
              }
              return <React.Fragment key={idx}>{renderProse(seg.content, idx)}</React.Fragment>;
            })}
          </div>
        );
      }

      function BuildCompactCodeCard({ lang, content }) {
        const [expanded, setExpanded] = useState(false);
        const [copied, setCopied] = useState(false);
        const lineCount = useMemo(() => String(content || '').split('\n').length, [content]);
        const isLong = lineCount > 7;

        return (
          <div
            style={{
              background: '#111113',
              border: '1px solid #2a2a2a',
              borderRadius: 10,
              overflow: 'hidden',
              margin: '6px 0',
            }}
          >
            <div
              style={{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                padding: '6px 10px',
                background: '#1b1b1e',
                borderBottom: '1px solid #2a2a2a',
                fontSize: 11.5,
                color: '#a1a1aa',
                fontFamily: 'ui-monospace, monospace',
              }}
            >
              <span>
                {lang || 'code'} · {lineCount} lines
              </span>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                {isLong && (
                  <button
                    type="button"
                    onClick={() => setExpanded((v) => !v)}
                    style={{
                      background: '#27272a',
                      border: '1px solid #3f3f46',
                      borderRadius: 6,
                      padding: '2px 8px',
                      color: '#f4f4f5',
                      cursor: 'pointer',
                      fontSize: 11,
                    }}
                  >
                    {expanded ? 'Collapse' : 'Expand'}
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => {
                    copyTextToClipboard(content, () => {
                      setCopied(true);
                      setTimeout(() => setCopied(false), 1600);
                    });
                  }}
                  style={{
                    background: 'transparent',
                    border: 'none',
                    color: '#d4d4d8',
                    cursor: 'pointer',
                    fontSize: 11.5,
                  }}
                >
                  {copied ? '✓ Copied' : 'Copy'}
                </button>
              </div>
            </div>
            <div style={{ position: 'relative' }}>
              <pre
                style={{
                  margin: 0,
                  padding: '10px 12px',
                  overflowX: 'auto',
                  overflowY: expanded ? 'visible' : 'hidden',
                  maxHeight: !expanded && isLong ? 140 : 'none',
                  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                  fontSize: 12.5,
                  lineHeight: 1.55,
                  color: '#e6e6e6',
                }}
                dangerouslySetInnerHTML={{ __html: highlightCodeSyntax(content) }}
              />
              {!expanded && isLong && (
                <div
                  onClick={() => setExpanded(true)}
                  style={{
                    background: 'linear-gradient(180deg, rgba(17,17,19,0) 0%, #111113 85%)',
                    padding: '18px 10px 6px',
                    textAlign: 'center',
                    fontSize: 11.5,
                    color: '#a855f7',
                    fontWeight: 600,
                    cursor: 'pointer',
                  }}
                >
                  ⤢ Expand full code ({lineCount} lines)
                </div>
              )}
            </div>
          </div>
        );
      }

      function AIItemView({ msg, onOpenFile, onFixError }) {
        const [thoughtOpen, setThoughtOpen] = useState(true);
        const [userToggledThought, setUserToggledThought] = useState(false);
        const [expandedCmds, setExpandedCmds] = useState({});
        const [expandedErr, setExpandedErr] = useState(false);

        useEffect(() => {
          if (!userToggledThought) {
            setThoughtOpen(Boolean(msg.running));
          }
        }, [msg.running, userToggledThought]);

        if (msg.role === 'user') {
          return (
            <div className="user-bubble fade-card">
              <div>{msg.text}</div>
              {Array.isArray(msg.attachments) && msg.attachments.length > 0 && (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 }}>
                  {msg.attachments.map((att, i) => (
                    <span
                      key={i}
                      style={{
                        fontSize: 11.5,
                        background: '#1d1d1d',
                        border: '1px solid #333',
                        borderRadius: 8,
                        padding: '3px 8px',
                        color: '#bbb',
                      }}
                    >
                      📎 {att.name || att.mimeType}
                    </span>
                  ))}
                </div>
              )}
            </div>
          );
        }

        if (msg.role === 'runtime_error') {
          const lines = String(msg.error || '').split('\n');
          const firstLine = lines[0] || 'Runtime error in preview';
          return (
            <div className="error-card fade-card">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                <button
                  type="button"
                  onClick={() => setExpandedErr(!expandedErr)}
                  style={{
                    background: 'transparent',
                    border: 'none',
                    color: '#ff6b6b',
                    fontWeight: 600,
                    fontSize: 13,
                    textAlign: 'left',
                    cursor: 'pointer',
                    flex: 1,
                  }}
                >
                  ⚠ {firstLine} {lines.length > 1 ? (expandedErr ? '▴' : '▾') : ''}
                </button>
                <button
                  type="button"
                  className="btn"
                  style={{ minHeight: 36, padding: '0 12px', fontSize: 12.5, borderColor: '#ff5252', color: '#ff8080' }}
                  onClick={() => onFixError(msg.error)}
                >
                  Fix error
                </button>
              </div>
              {expandedErr && (
                <pre
                  style={{
                    fontSize: 12,
                    color: '#ffb3b3',
                    whiteSpace: 'pre-wrap',
                    wordBreak: 'break-word',
                    background: 'rgba(0,0,0,0.25)',
                    padding: 8,
                    borderRadius: 8,
                  }}
                >
                  {msg.error}
                </pre>
              )}
            </div>
          );
        }

        const hasThought = Boolean(msg.thought && msg.thought.trim()) || Boolean(msg.running);
        const liveHeading = msg.heading || extractBoldHeading(msg.thought) || (msg.running ? 'Thinking...' : 'Thought summary');
        const plan = msg.plan || null;
        const filesList = Array.isArray(msg.files) ? msg.files : [];
        const cmdsList = Array.isArray(msg.cmds) ? msg.cmds : [];

        return (
          <div className="ai-turn fade-card">
            {/* 1. Collapsible thinking line */}
            {hasThought && (
              <div className="trace-card">
                <button
                  type="button"
                  className="trace-header"
                  onClick={() => {
                    setUserToggledThought(true);
                    setThoughtOpen(!thoughtOpen);
                  }}
                >
                  <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                    {msg.running ? (
                      <span style={{ color: '#e6e6e6', fontWeight: 600 }}>◌ {liveHeading}</span>
                    ) : (
                      <span style={{ color: '#3ddc84', fontWeight: 600 }}>✓ {liveHeading}</span>
                    )}
                  </span>
                  <span style={{ color: '#888', fontSize: 12 }}>{thoughtOpen ? '▴' : '▾'}</span>
                </button>
                {thoughtOpen && msg.thought && (
                  <div className="trace-body">
                    <BuildMarkdownView text={msg.thought} isThought={true} />
                  </div>
                )}
              </div>
            )}

            {msg.plan && <details className="trace-card" open><summary className="trace-header">Gemini plan · {msg.plan.goal || 'Build plan'}</summary><div className="trace-body"><ol>{(msg.plan.steps || []).map((step, i) => <li key={i}>{step}</li>)}</ol>{msg.plan.instructions && <p>{msg.plan.instructions}</p>}</div></details>}
            {/* 2. File rows */}
            {filesList.map((f, idx) => (
              <div
                key={`${f.path}-${idx}`}
                className="file-row"
                onClick={() => {
                  if (f.op !== 'delete') onOpenFile(f.path);
                }}
              >
                <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                  {f.op === 'delete' ? (
                    <span style={{ color: '#ff6b6b' }}>🗑</span>
                  ) : f.done ? (
                    <span style={{ color: '#3ddc84', fontWeight: 700 }}>✓</span>
                  ) : (
                    <span className="spinner" />
                  )}
                  <span style={{ fontFamily: 'ui-monospace, monospace', fontSize: 12.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {f.path}
                  </span>
                </span>
                <span style={{ fontSize: 12, color: '#888' }}>
                  {f.op === 'delete' ? '(deleted)' : f.done ? 'written' : 'writing...'}
                </span>
              </div>
            ))}

            {/* 3. Command rows */}
            {cmdsList.map((c, idx) => {
              const key = c.id || idx;
              const isExp = Boolean(expandedCmds[key]);
              return (
                <div key={key} className="trace-card">
                  <button
                    type="button"
                    className="trace-header"
                    onClick={() =>
                      setExpandedCmds((prev) => ({ ...prev, [key]: !prev[key] }))
                    }
                  >
                    <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'ui-monospace, monospace', fontSize: 12.5 }}>
                      {!c.done ? (
                        <span className="spinner" />
                      ) : c.ok === false ? (
                        <span style={{ color: '#ff5252', fontWeight: 700 }}>✕</span>
                      ) : (
                        <span style={{ color: '#3ddc84', fontWeight: 700 }}>✓</span>
                      )}
                      <span>$ {c.cmd}</span>
                    </span>
                    <span style={{ color: '#888', fontSize: 12 }}>{isExp ? '▴' : '▾'}</span>
                  </button>
                  {isExp && (
                    <pre className="trace-body" style={{ fontFamily: 'ui-monospace, monospace', margin: 0 }}>
                      {c.output || (c.done ? '(no output)' : 'Running...')}
                    </pre>
                  )}
                </div>
              );
            })}

            {/* 4. Error message if model failed or returned nothing after thinking */}
            {msg.error && (
              <div className="error-card">
                <div style={{ color: '#ff6b6b', fontSize: 13.5, fontWeight: 600 }}>
                  {msg.error}
                </div>
              </div>
            )}

            {/* 5. Final reply */}
            {msg.text && (
              <div className="ai-reply">
                <BuildMarkdownView text={msg.text} isThought={false} />
              </div>
            )}
          </div>
        );
      }

      function App() {
        const [projects, setProjects] = useState(() => safeReadStorage(STORAGE_KEYS.PROJECTS, []));
        const [selectedModel, setSelectedModel] = useState(() => safeReadStorage(STORAGE_KEYS.MODEL, 'gemini-3.8-flash'));
        const [plannerModel, setPlannerModel] = useState(() => safeReadStorage('aib_planner_model', 'gemini-3.8-flash'));
        const [modelSelectionTarget, setModelSelectionTarget] = useState('run');
        const [frameworkPreviewUrl, setFrameworkPreviewUrl] = useState('');
        const [frameworkPreviewStatus, setFrameworkPreviewStatus] = useState('');
        const [favorites, setFavorites] = useState(() => safeReadStorage(STORAGE_KEYS.FAV, []));
        const [nvidiaModels, setNvidiaModels] = useState([]);

        // Screens: 'welcome' | 'home' | 'work'
        const [screen, setScreen] = useState(() => {
          const saved = safeReadStorage(STORAGE_KEYS.PROJECTS, []);
          return saved.length > 0 ? 'home' : 'welcome';
        });

        const [currentProjectId, setCurrentProjectId] = useState(null);
        const [homePrompt, setHomePrompt] = useState('');
        const [chatPrompt, setChatPrompt] = useState('');
        const [attachments, setAttachments] = useState([]);
        const [showAllProjects, setShowAllProjects] = useState(false);
        const [newProjNameModal, setNewProjNameModal] = useState(false);
        const [newProjNameInput, setNewProjNameInput] = useState('');
        const [modelSheetOpen, setModelSheetOpen] = useState(false);

        // Work screen state
        const [activeTab, setActiveTab] = useState('Preview'); // 'Chat' | 'Preview' | 'Code'
        const [selectedFile, setSelectedFile] = useState('src/App.jsx');
        const [isRunning, setIsRunning] = useState(false);
        const [previewDoc, setPreviewDoc] = useState('');
        const [previewFullScreen, setPreviewFullScreen] = useState(false);
        const [logs, setLogs] = useState([]);
        const [terminalOpen, setTerminalOpen] = useState(false);

        const fileInputRef = useRef(null);
        const chatScrollRef = useRef(null);
        const eventSourceRef = useRef(null);
        const seenErrorsRef = useRef(new Set());
        const runtimeFixAttemptsRef = useRef(0);
        const startAgentRunRef = useRef(null);

        // Persist to localStorage
        useEffect(() => {
          safeWriteStorage(STORAGE_KEYS.PROJECTS, projects);
        }, [projects]);

        useEffect(() => {
          safeWriteStorage(STORAGE_KEYS.MODEL, selectedModel);
        }, [selectedModel]);
        useEffect(() => { safeWriteStorage('aib_planner_model', plannerModel); }, [plannerModel]);

        useEffect(() => {
          safeWriteStorage(STORAGE_KEYS.FAV, favorites);
        }, [favorites]);

        // Load NVIDIA models from /api/models
        useEffect(() => {
          fetch('/api/models')
            .then((r) => r.json())
            .then((data) => {
              if (Array.isArray(data?.nvidia)) {
                setNvidiaModels(data.nvidia);
              } else if (Array.isArray(data?.models)) {
                setNvidiaModels(data.models);
              }
            })
            .catch(() => {});
        }, []);

        const currentProject = useMemo(
          () => projects.find((p) => p.id === currentProjectId) || null,
          [projects, currentProjectId]
        );

        // Listen for postMessage logs from the preview iframe
        useEffect(() => {
          const handler = (e) => {
            const data = e.data;
            if (!data || data.t !== 'log') return;
            const lv = data.lv || 'log';
            const msg = String(data.msg ?? '');
            const time = new Date().toLocaleTimeString([], { hour12: false });

            setLogs((prev) => {
              const next = [...prev, { time, lv, msg }];
              return next.length > 200 ? next.slice(next.length - 200) : next;
            });

            if (lv === 'error' && currentProjectId) {
              const sig = `${currentProjectId}:${msg}`;
              if (!seenErrorsRef.current.has(sig)) {
                seenErrorsRef.current.add(sig);
                setProjects((prev) =>
                  prev.map((p) => {
                    if (p.id !== currentProjectId) return p;
                    return {
                      ...p,
                      messages: [
                        ...(p.messages || []),
                        {
                          id: `err_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                          role: 'runtime_error',
                          error: msg,
                        },
                      ],
                    };
                  })
                );
                // Bounded automatic runtime recovery: never create an endless fix loop.
                if (runtimeFixAttemptsRef.current < 2 && startAgentRunRef.current) {
                  runtimeFixAttemptsRef.current += 1;
                  const round = runtimeFixAttemptsRef.current;
                  setTimeout(() => {
                    startAgentRunRef.current?.(
                      currentProjectId,
                      `Auto-fix runtime error (round ${round}/2). Analyze this exact preview console error, inspect the current project files, fix only the affected files completely, preserve all existing features, and run the relevant checks. Error:\n${msg}`,
                      [],
                      true
                    );
                  }, 250);
                }
              }
            }
          };
          window.addEventListener('message', handler);
          return () => window.removeEventListener('message', handler);
        }, [currentProjectId]);

        // Rebuild preview document ONLY when AI is idle
        useEffect(() => {
          if (isRunning) return;
          if (!currentProject) {
            setPreviewDoc('');
            return;
          }
          const files = currentProject.files || {};
          const pkg = (() => { try { return JSON.parse(files['package.json'] || '{}'); } catch { return {}; } })();
          const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          const isViteProject = Boolean(deps.vite) || Object.keys(files).some((k) => /(^|\/)vite\.config\.[cm]?[jt]s$/.test(k));
          if (isViteProject) {
            setPreviewDoc('');
            setFrameworkPreviewUrl('');
            setFrameworkPreviewStatus('Installing project dependencies and starting live Vite preview…');
            let cancelled = false;
            fetch('/api/preview/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ files, projectId: currentProject.id }) })
              .then(async (r) => { const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Preview startup failed'); return data; })
              .then((data) => { if (!cancelled) { setFrameworkPreviewUrl(data.previewUrl); setFrameworkPreviewStatus(''); } })
              .catch((err) => { if (!cancelled) setFrameworkPreviewStatus(`Live preview could not start: ${err.message}`); });
            return () => { cancelled = true; };
          }
          setFrameworkPreviewUrl('');
          setFrameworkPreviewStatus('');
          const hasRenderable = Object.keys(files).some((k) => /\.(jsx|js|html)$/i.test(k));
          if (!hasRenderable) { setPreviewDoc(''); return; }
          setPreviewDoc(buildProjectHtml(files, true));
        }, [isRunning, currentProjectId, currentProject?.files]);

        // Ensure selectedFile is valid when files change
        useEffect(() => {
          if (!currentProject) return;
          const keys = Object.keys(currentProject.files || {});
          if (keys.length > 0 && (!selectedFile || !(selectedFile in currentProject.files))) {
            setSelectedFile(currentProject.files['src/App.jsx'] !== undefined ? 'src/App.jsx' : keys[0]);
          }
        }, [currentProject?.files, selectedFile]);

        // Auto-scroll chat
        useEffect(() => {
          if (chatScrollRef.current) {
            chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
          }
        }, [currentProject?.messages]);

        const connectToJobStream = useCallback((projId, jobId, aiMsgId) => {
          if (eventSourceRef.current) {
            eventSourceRef.current.close();
          }

          setIsRunning(true);
          const es = new EventSource(`/api/job/${encodeURIComponent(jobId)}`);
          eventSourceRef.current = es;

          // Keep clean accumulators for replay safety
          let thoughtAcc = '';
          let headingAcc = '';
          let textAcc = '';
          let errorAcc = '';
          let planAcc = null;
          const filesMap = new Map();
          const cmdsMap = new Map();

          const syncMessageState = (stillRunning, finalFilesObj) => {
            setProjects((prev) =>
              prev.map((p) => {
                if (p.id !== projId) return p;
                const nextFiles = finalFilesObj ? { ...finalFilesObj } : { ...(p.files || {}) };
                const msgs = (p.messages || []).map((m) => {
                  if (m.id !== aiMsgId) return m;
                  return {
                    ...m,
                    running: stillRunning,
                    thought: thoughtAcc,
                    heading: headingAcc || extractBoldHeading(thoughtAcc),
                    text: textAcc,
                    error: errorAcc,
                    files: Array.from(filesMap.values()),
                    cmds: Array.from(cmdsMap.values()),
                    plan: planAcc,
                  };
                });
                return {
                  ...p,
                  files: nextFiles,
                  messages: msgs,
                  activeJobId: stillRunning ? jobId : null,
                };
              })
            );
          };

          let jobFinished = false;
          es.onmessage = (evt) => {
            if (!evt.data) return;
            let ev;
            try {
              ev = JSON.parse(evt.data);
            } catch {
              return;
            }

            if (ev.type === 'plan') {
              planAcc = ev.plan || null;
              syncMessageState(true, null);
            } else if (ev.type === 'thought') {
              thoughtAcc += ev.text || '';
              if (ev.heading) headingAcc = ev.heading;
              syncMessageState(true, null);
            } else if (ev.type === 'project_name' && ev.name) {
              setProjects((prev) =>
                prev.map((p) => (p.id === projId ? { ...p, name: String(ev.name).trim() } : p))
              );
            } else if (ev.type === 'text') {
              textAcc += ev.text || '';
              syncMessageState(true, null);
            } else if (ev.type === 'file') {
              const path = ev.path;
              if (ev.op === 'delete') {
                filesMap.set(path, { path, op: 'delete', done: true });
                setProjects((prev) =>
                  prev.map((p) => {
                    if (p.id !== projId) return p;
                    const copy = { ...(p.files || {}) };
                    delete copy[path];
                    return { ...p, files: copy };
                  })
                );
              } else if (ev.stage === 'start') {
                filesMap.set(path, { path, op: 'write', done: false });
                setSelectedFile(path);
              } else if (ev.stage === 'chunk') {
                filesMap.set(path, { path, op: 'write', done: false });
                setProjects((prev) =>
                  prev.map((p) => {
                    if (p.id !== projId) return p;
                    return {
                      ...p,
                      files: { ...(p.files || {}), [path]: ev.content || '' },
                    };
                  })
                );
              } else if (ev.stage === 'done') {
                filesMap.set(path, { path, op: 'write', done: true });
                setProjects((prev) =>
                  prev.map((p) => {
                    if (p.id !== projId) return p;
                    return {
                      ...p,
                      files: { ...(p.files || {}), [path]: ev.content ?? p.files?.[path] ?? '' },
                    };
                  })
                );
              }
              syncMessageState(true, null);
            } else if (ev.type === 'cmd') {
              const id = ev.id || ev.cmd;
              if (ev.stage === 'start') {
                cmdsMap.set(id, { id, cmd: ev.cmd, done: false, output: '', ok: true });
              } else {
                cmdsMap.set(id, { id, cmd: ev.cmd, done: true, output: ev.output || '', ok: ev.ok });
              }
              syncMessageState(true, null);
            } else if (ev.type === 'error') {
              errorAcc = ev.message || 'An error occurred.';
              syncMessageState(true, null);
            } else if (ev.type === 'done') {
              jobFinished = true;
              syncMessageState(false, ev.files || null);
              setIsRunning(false);
              es.close();
              eventSourceRef.current = null;
            }
          };

          es.onerror = () => {
            es.close();
            if (!jobFinished) {
              setTimeout(() => {
                if (eventSourceRef.current === es) {
                  connectToJobStream(projId, jobId, aiMsgId);
                }
              }, 1500);
            } else {
              setIsRunning(false);
              eventSourceRef.current = null;
            }
          };
        }, []);

        // Resume any unfinished job when opening a project or reloading the page
        useEffect(() => {
          if (!currentProject || !currentProject.activeJobId) return;
          const lastAiMsg = [...(currentProject.messages || [])]
            .reverse()
            .find((m) => m.role === 'ai');
          if (lastAiMsg) {
            connectToJobStream(currentProject.id, currentProject.activeJobId, lastAiMsg.id);
          }
        }, [currentProjectId]);

        const startAgentRun = async (projId, promptText, atts = [], isAutomaticFix = false) => {
          const targetProj = projects.find((p) => p.id === projId);
          const existingMessages = targetProj ? targetProj.messages || [] : [];
          const existingFiles = targetProj ? targetProj.files || {} : {};

          const userMsg = {
            id: `u_${Date.now()}`,
            role: 'user',
            text: promptText,
            attachments: atts,
          };
          const aiMsgId = `ai_${Date.now() + 1}`;
          const aiMsg = {
            id: aiMsgId,
            plan: null,
            role: 'ai',
            running: true,
            thought: '',
            heading: '',
            text: '',
            error: '',
            files: [],
            cmds: [],
          };

          // Reset runtime recovery budget only for a fresh user request, not for auto-fix rounds.
          if (!isAutomaticFix) runtimeFixAttemptsRef.current = 0;
          setLogs([]);
          seenErrorsRef.current.clear();
          setIsRunning(true);

          const updatedMessages = [...existingMessages, userMsg, aiMsg];

          setProjects((prev) =>
            prev.map((p) => {
              if (p.id !== projId) return p;
              const updatedName =
                !p.name || p.name === 'Untitled Project'
                  ? deriveProjectName(promptText)
                  : p.name;
              return {
                ...p,
                name: updatedName,
                messages: updatedMessages,
              };
            })
          );

          try {
            const apiMessages = [...existingMessages, userMsg]
              .filter((m) => m.role === 'user' || m.role === 'ai')
              .map((m) => ({
                role: m.role,
                text: m.text || '',
                attachments: m.attachments,
              }));

            const resp = await fetch('/api/agent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: selectedModel,
                plannerModel,
                messages: apiMessages,
                files: existingFiles,
                attachments: atts,
              }),
            });
            const data = await resp.json();
            if (!resp.ok || !data.job) {
              throw new Error(data.error || `Failed to start job (HTTP ${resp.status})`);
            }

            setProjects((prev) =>
              prev.map((p) => (p.id === projId ? { ...p, activeJobId: data.job } : p))
            );
            connectToJobStream(projId, data.job, aiMsgId);
          } catch (err) {
            setIsRunning(false);
            setProjects((prev) =>
              prev.map((p) => {
                if (p.id !== projId) return p;
                return {
                  ...p,
                  messages: (p.messages || []).map((m) =>
                    m.id === aiMsgId
                      ? { ...m, running: false, error: String(err.message || err) }
                      : m
                  ),
                };
              })
            );
          }
        };

        startAgentRunRef.current = startAgentRun;

        const handleStartFromHome = () => {
          const text = homePrompt.trim();
          if (!text) return;
          const projId = `proj_${Date.now()}`;
          const newProj = {
            id: projId,
            name: deriveProjectName(text),
            files: {},
            messages: [],
            activeJobId: null,
          };
          const currentAtts = [...attachments];
          setProjects((prev) => [newProj, ...prev]);
          setCurrentProjectId(projId);
          setHomePrompt('');
          setAttachments([]);
          setScreen('work');
          setActiveTab('Chat');

          // Kick off agent run
          setTimeout(() => {
            startAgentRunFromNewProject(newProj, text, currentAtts);
          }, 20);
        };

        const startAgentRunFromNewProject = async (newProj, promptText, atts) => {
          const userMsg = {
            id: `u_${Date.now()}`,
            role: 'user',
            text: promptText,
            attachments: atts,
          };
          const aiMsgId = `ai_${Date.now() + 1}`;
          const aiMsg = {
            id: aiMsgId,
            plan: null,
            role: 'ai',
            running: true,
            thought: '',
            heading: '',
            text: '',
            error: '',
            files: [],
            cmds: [],
          };

          runtimeFixAttemptsRef.current = 0;
          setLogs([]);
          seenErrorsRef.current.clear();
          setIsRunning(true);

          setProjects((prev) =>
            prev.map((p) =>
              p.id === newProj.id ? { ...p, messages: [userMsg, aiMsg] } : p
            )
          );

          try {
            const resp = await fetch('/api/agent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: selectedModel,
                plannerModel,
                messages: [{ role: 'user', text: promptText, attachments: atts }],
                files: {},
                attachments: atts,
              }),
            });
            const data = await resp.json();
            if (!resp.ok || !data.job) {
              throw new Error(data.error || 'Failed to start job');
            }
            setProjects((prev) =>
              prev.map((p) => (p.id === newProj.id ? { ...p, activeJobId: data.job } : p))
            );
            connectToJobStream(newProj.id, data.job, aiMsgId);
          } catch (err) {
            setIsRunning(false);
            setProjects((prev) =>
              prev.map((p) =>
                p.id === newProj.id
                  ? {
                      ...p,
                      messages: (p.messages || []).map((m) =>
                        m.id === aiMsgId
                          ? { ...m, running: false, error: String(err.message || err) }
                          : m
                      ),
                    }
                  : p
              )
            );
          }
        };

        const handleSendInWork = () => {
          const text = chatPrompt.trim();
          if (!text || !currentProject || isRunning) return;
          const atts = [...attachments];
          setChatPrompt('');
          setAttachments([]);
          startAgentRun(currentProject.id, text, atts);
        };

        const handleCreateBlankProject = () => {
          const projId = `proj_${Date.now()}`;
          const cleanName = newProjNameInput.trim() || 'Untitled Project';
          const newProj = {
            id: projId,
            name: cleanName,
            files: {},
            messages: [],
            activeJobId: null,
          };
          setProjects((prev) => [newProj, ...prev]);
          setCurrentProjectId(projId);
          setNewProjNameInput('');
          setNewProjNameModal(false);
          setScreen('work');
        };

        const handleFileSelect = (e) => {
          const fileList = Array.from(e.target.files || []);
          fileList.forEach((file) => {
            const reader = new FileReader();
            reader.onload = () => {
              setAttachments((prev) => [
                ...prev,
                {
                  name: file.name,
                  mimeType: file.type || 'application/octet-stream',
                  data: String(reader.result || ''),
                },
              ]);
            };
            reader.readAsDataURL(file);
          });
          e.target.value = '';
        };

        const handleToggleFavorite = (modelId) => {
          setFavorites((prev) =>
            prev.includes(modelId) ? prev.filter((x) => x !== modelId) : [...prev, modelId]
          );
        };

        const handleDownloadZip = async () => {
          if (!currentProject || typeof JSZip === 'undefined') return;
          const zip = new JSZip();
          const files = { ...(currentProject.files || {}) };

          Object.entries(files).forEach(([path, content]) => {
            if (typeof content === 'string' && content.startsWith('__AIB_BINARY_BASE64__:')) {
              zip.file(path, content.slice('__AIB_BINARY_BASE64__:'.length), { base64: true });
            } else {
              zip.file(path, content);
            }
          });

          const standaloneHtml = buildProjectHtml(files, false);
          if (files['index.html']) {
            zip.file('standalone.html', standaloneHtml);
          } else {
            zip.file('index.html', standaloneHtml);
          }

          if (!files['package.json']) {
            zip.file(
              'package.json',
              JSON.stringify(
                {
                  name: (currentProject.name || 'ai-app').toLowerCase().replace(/[^a-z0-9-]+/g, '-'),
                  version: '1.0.0',
                  private: true,
                  scripts: {
                    start: 'npx serve .',
                  },
                },
                null,
                2
              )
            );
          }

          if (!files['README.md']) {
            zip.file(
              'README.md',
              `# ${currentProject.name || 'AI App'}\n\nBuilt with AI App Builder.\n\n## Run\n\n\`\`\`bash\nnpx serve .\n\`\`\`\n`
            );
          }

          const blob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${(currentProject.name || 'project').toLowerCase().replace(/[^a-z0-9-_]+/g, '-')}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        };

        const { shortName: currentModelShort } = splitModelDisplay(selectedModel);
        const errorLogsCount = logs.filter((l) => l.lv === 'error').length;

        return (
          <>
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*,video/*"
              multiple
              style={{ display: 'none' }}
              onChange={handleFileSelect}
            />

            {/* SCREEN 0: CHAT MODE (COMPLETE WHITE THEME, GEMINI EXCLUSIVE, THINKING ENABLED) */}
            {screen === 'chatmode' && (
              <ChatModeView
                selectedModel={selectedModel}
                onSelectModel={setSelectedModel}
                plannerModel={plannerModel}
                onSelectPlannerModel={setPlannerModel}
                nvidiaModels={nvidiaModels}
                onSwitchToBuild={() => setScreen('home')}
              />
            )}

            {/* SCREEN 1: WELCOME */}
            {screen === 'welcome' && (
              <div className="screen-center">
                <div className="panel welcome-card fade-card">
                  <div style={{ fontSize: 32 }}>✦</div>
                  <h1 style={{ fontSize: 26, fontWeight: 700 }}>Welcome</h1>
                  <p style={{ color: '#888', fontSize: 15, lineHeight: 1.5 }}>
                    Describe an app and let AI build it.
                  </p>
                  <button
                    type="button"
                    className="btn btn-main"
                    style={{ width: '100%', marginTop: 8 }}
                    onClick={() => setScreen('home')}
                  >
                    Get started
                  </button>
                  <button
                    type="button"
                    className="btn"
                    style={{
                      width: '100%',
                      background: 'linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #db2777 100%)',
                      border: 'none',
                      color: '#fff',
                      fontWeight: 600,
                    }}
                    onClick={() => setScreen('chatmode')}
                  >
                    ✦ Open Chat Mode
                  </button>
                </div>
              </div>
            )}

            {/* SCREEN 2: HOME */}
            {screen === 'home' && (
              <div className="screen-center">
                <div className="home-container fade-card">
                  {/* Mode Switcher Bar: Build Mode vs Chat Mode */}
                  <div style={{ display: 'flex', justifyContent: 'center' }}>
                    <div
                      style={{
                        display: 'inline-flex',
                        background: '#1d1d1d',
                        border: '1px solid #2a2a2a',
                        borderRadius: 14,
                        padding: 4,
                        gap: 6,
                      }}
                    >
                      <button
                        type="button"
                        className="btn"
                        style={{
                          minHeight: 38,
                          background: '#e6e6e6',
                          color: '#111',
                          borderColor: '#e6e6e6',
                          fontWeight: 600,
                        }}
                      >
                        ⚒ Build Mode
                      </button>
                      <button
                        type="button"
                        className="btn"
                        style={{
                          minHeight: 38,
                          background: 'linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #db2777 100%)',
                          color: '#fff',
                          border: 'none',
                          fontWeight: 600,
                        }}
                        onClick={() => setScreen('chatmode')}
                      >
                        ✦ Chat Mode
                      </button>
                    </div>
                  </div>

                  <h1 style={{ fontSize: 'clamp(26px, 4vw, 36px)', fontWeight: 700, textAlign: 'center' }}>
                    What should we build?
                  </h1>

                  <div className="rgb-box">
                    <div className="rgb-inner">
                      <textarea
                        className="prompt-textarea"
                        placeholder="Describe an app and let Gemini do the rest"
                        value={homePrompt}
                        onChange={(e) => setHomePrompt(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                            e.preventDefault();
                            handleStartFromHome();
                          }
                        }}
                      />

                      {attachments.length > 0 && (
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                          {attachments.map((att, idx) => (
                            <span
                              key={idx}
                              style={{
                                display: 'inline-flex',
                                alignItems: 'center',
                                gap: 6,
                                background: '#262626',
                                border: '1px solid #333',
                                borderRadius: 8,
                                padding: '4px 8px',
                                fontSize: 12,

                            >

      function copyTextToClipboard(text, onDone) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => onDone && onDone()).catch(() => {});
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          if (onDone) onDone();
        }
      }

      function downloadBlobFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function downloadDataUrlAsPng(dataUrl, filename = 'gemini-image.png') {
        if (dataUrl.startsWith('data:image/png')) {
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || 1024;
          canvas.height = img.naturalHeight || 1024;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const pngUrl = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
        img.src = dataUrl;
      }

      function highlightCodeSyntax(code) {
        const escaped = String(code || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        const tokenRegex =
          /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|&lt;!--[\s\S]*?--&gt;)|("[^"\n\\]*(?:\\.[^"\n\\]*)*"|'[^'\n\\]*(?:\\.[^'\n\\]*)*'|`[\s\S]*?`)|(&lt;\/?[a-zA-Z0-9_.-]+|\/?&gt;)|\b(import|export|default|from|function|return|const|let|var|if|else|switch|case|break|continue|for|while|do|try|catch|finally|throw|new|class|extends|super|async|await|true|false|null|undefined|typeof|instanceof|void|delete|in|of|interface|type|enum)\b|\b(\d+(?:\.\d+)?(?:px|rem|em|vh|vw|%|s|ms)?)\b|\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g;

        return escaped.replace(
          tokenRegex,
          (match, comment, str, tag, kw, num, fnName) => {
            if (comment) {
              return `<span style="color:#64748b;font-style:italic">${comment}</span>`;
            }
            if (str) {
              return `<span style="color:#86efac">${str}</span>`;
            }
            if (tag) {
              return `<span style="color:#38bdf8;font-weight:600">${tag}</span>`;
            }
            if (kw) {
              return `<span style="color:#c084fc;font-weight:600">${kw}</span>`;
            }
            if (num) {
              return `<span style="color:#fb923c">${num}</span>`;
            }
            if (fnName) {
              return `<span style="color:#fde047">${fnName}</span>`;
            }
            return match;
          }
        );
      }

      function buildRunnableHtmlPreviewDoc(code, lang, previewId) {
        const l = String(lang || 'html').toLowerCase();
        const errorCaptureScript = `<script>
(function() {
  window.onerror = function(msg, src, line, col) {
    window.parent.postMessage({ t: "cm_preview_err", id: "${previewId}", err: String(msg) + (line ? " (line " + line + ":" + (col || 0) + ")" : "") }, "*");
  };
  window.addEventListener("unhandledrejection", function(e) {
    var r = e && e.reason ? (e.reason.message || String(e.reason)) : "Unhandled rejection";
    window.parent.postMessage({ t: "cm_preview_err", id: "${previewId}", err: r }, "*");
  });
  var origErr = console.error;
  console.error = function() {
    var msg = Array.prototype.slice.call(arguments).map(function(x){ return typeof x === "object" ? JSON.stringify(x) : String(x); }).join(" ");
    window.parent.postMessage({ t: "cm_preview_err", id: "${previewId}", err: msg }, "*");
    if (origErr) origErr.apply(console, arguments);
  };
})();
<\/script>`;

        if (l === 'js' || l === 'javascript') {
          return `<!doctype html><html><head><meta charset="utf-8">${errorCaptureScript}<style>body{font-family:system-ui,sans-serif;padding:16px;color:#0f172a;background:#fff;}</style></head><body><div id="app"></div><pre id="log" style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;font-size:13px;"></pre><script>
(function(){
  var logEl = document.getElementById('log');
  var origLog = console.log;
  console.log = function() {
    var line = Array.prototype.slice.call(arguments).map(function(x){ return typeof x === 'object' ? JSON.stringify(x, null, 2) : String(x); }).join(' ');
    logEl.textContent += line + '\\n';
    if (origLog) origLog.apply(console, arguments);
  };
})();
${code}
<\/script></body></html>`;
        }

        if (l === 'css') {
          return `<!doctype html><html><head><meta charset="utf-8">${errorCaptureScript}<style>${code}</style></head><body><div class="demo"><h2>CSS Live Preview</h2><p>Your stylesheet is active in this sandbox.</p><button>Sample Button</button></div></body></html>`;
        }

        if (/<html[\s>]|<!doctype/i.test(code)) {
          return code.replace(/<head([^>]*)>/i, `<head$1>${errorCaptureScript}`);
        }

        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${errorCaptureScript}</head><body>${code}</body></html>`;
      }

      function ChatCodeBlock({ lang, code, onFixError }) {
        const [copied, setCopied] = useState(false);
        const [expanded, setExpanded] = useState(false);
        const [running, setRunning] = useState(false);
        const [previewErrors, setPreviewErrors] = useState([]);
        const [runKey, setRunKey] = useState(0);
        const [fullScreen, setFullScreen] = useState(false);
        const [fullScreenPreview, setFullScreenPreview] = useState(false);
        const previewId = useMemo(() => `prv_${Math.random().toString(36).slice(2, 9)}`, []);

        const normLang = (lang || 'html').toLowerCase();
        const isRunnable = ['html', 'htm', 'xml', 'javascript', 'js', 'css', 'web', ''].includes(normLang);
        const displayLang =
          normLang === 'html' || normLang === '' ? 'HTML + CSS + JS' : normLang.toUpperCase();
        const lineCount = useMemo(() => String(code || '').split('\n').length, [code]);

        useEffect(() => {

      function renderInlineFormatting(lineText) {
        if (!lineText) return null;
        // Pre-convert any un-delimited LaTeX commands (\text{}, \frac{}{}, \times, \pi, etc.) if present outside $...$
        let normalizedLine = String(lineText);
        if (/\\(?:text|frac|sqrt|times|div|pi|leq|geq|neq|approx)\b/.test(normalizedLine) && !normalizedLine.includes('$')) {
          normalizedLine = formatLatexMathString(normalizedLine);
        }

        const pattern =
          /(`[^`]+`|\$\$[^$]+\$\$|\$[^$\n]+\$|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<]+|\*\*\*[^*]+\*\*\*|\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g;
        const parts = normalizedLine.split(pattern);

        return parts.map((part, idx) => {
          if (!part) return null;
          if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
            const innerCode = part.slice(1, -1);
            const formattedCode = /\\(?:text|frac|sqrt|times|pi)|\^/.test(innerCode)
              ? formatLatexMathString(innerCode)
              : innerCode;
            return (
              <code
                key={idx}
                style={{
                  background: '#27272a',
                  color: '#f4f4f5',
                  padding: '2px 6px',
                  borderRadius: 6,
                  fontSize: '0.9em',
                  fontFamily: 'ui-monospace, monospace',
                }}
              >
                {formattedCode}
              </code>
            );
          }
          if (
            (part.startsWith('$$') && part.endsWith('$$') && part.length > 4) ||
            (part.startsWith('$') && part.endsWith('$') && part.length > 2)
          ) {
            const cleanMath = formatLatexMathString(part);
            const isShortUnitOrVar =
              cleanMath.length <= 6 && !/[×÷+−=()]/.test(cleanMath.replace(/^=\s*/, ''));
            if (isShortUnitOrVar) {
              return (
                <strong key={idx} style={{ fontWeight: 600, color: '#f4f4f5' }}>
                  {cleanMath}
                </strong>
              );
            }
            return (
              <span
                key={idx}
                style={{
                  display: 'inline-block',
                  background: 'rgba(168, 85, 247, 0.14)',
                  border: '1px solid rgba(168, 85, 247, 0.3)',
                  color: '#f3e8ff',
                  padding: '1px 7px',
                  borderRadius: 6,
                  fontWeight: 600,
                  fontSize: '0.95em',
                  letterSpacing: '0.01em',
                }}
              >
                {cleanMath}
              </span>
            );
          }
          const mdLink = /^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/.exec(part);
          if (mdLink) {
            return (
              <a
                key={idx}
                href={mdLink[2]}
                target="_blank"
                rel="noopener noreferrer"
                className="cm-link-pill"
              >
                {mdLink[1]} ↗
              </a>
            );
          }
          if (/^https?:\/\/[^\s)<]+$/.test(part)) {
            return (
              <a
                key={idx}
                href={part}
                target="_blank"
                rel="noopener noreferrer"
                className="cm-link-pill"
              >
                {part.replace(/^https?:\/\//, '').slice(0, 42)} ↗
              </a>
            );
          }
          if (part.startsWith('***') && part.endsWith('***') && part.length > 6) {
            return (
              <strong key={idx} style={{ fontWeight: 700, fontStyle: 'italic', color: '#ffffff' }}>
                {formatLatexMathString(part.slice(3, -3))}
              </strong>
            );
          }
          if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
            const innerBold = part.slice(2, -2);
            return (
              <strong key={idx} style={{ fontWeight: 700, color: '#ffffff' }}>
                {innerBold.includes('$') || innerBold.includes('\\')
                  ? formatLatexMathString(innerBold)
                  : innerBold}
              </strong>
            );
          }
          if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
            const innerItalic = part.slice(1, -1);
            return (
              <em key={idx} style={{ fontStyle: 'italic', color: '#d8b4fe', fontWeight: 500 }}>
                {innerItalic.includes('$') || innerItalic.includes('\\')
                  ? formatLatexMathString(innerItalic)
                  : innerItalic}
              </em>
            );
          }
          return <React.Fragment key={idx}>{part}</React.Fragment>;
        });
      }

      function ChatMarkdownBody({ text, onFixError }) {
        const cleaned = String(text || '')
          .replace(/`?<project_name>[\s\S]*?<\/project_name>`?/gi, '')
          .replace(/`?<generate_image(?:\s+[^>]*)?>[\s\S]*?<\/generate_image>`?/gi, '')
          .replace(/```svg[\s\S]*?```/gi, '')
          .replace(/<svg[\s\S]*?<\/svg>/gi, '')
          .replace(/`?thinking_enabled\s*=\s*true`?/gi, '')
          .replace(/^#*\s*\*?\*?Analyzing Request\s*&\s*Selecting Skill\*?\*?.*$/gim, '')
          .replace(/^\s*[-*•]?\s*\*?\*?Skill Selected:\*?\*?.*$/gim, '')
          .replace(/^\s*[-*•]?\s*\*?\*?Format:\*?\*?\s*`?\s*$/gim, '');

        const segments = [];
        const codeFenceRegex = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)(?:```|$)/g;
        let lastIdx = 0;
        let match;

        while ((match = codeFenceRegex.exec(cleaned)) !== null) {
          if (match.index > lastIdx) {
            segments.push({ type: 'prose', content: cleaned.slice(lastIdx, match.index) });
          }
          const lang = (match[1] || 'html').trim().toLowerCase();
          const codeContent = match[2];
          if (lang !== 'svg' && !codeContent.trim().startsWith('<svg')) {
            segments.push({ type: 'code', lang, content: codeContent });
          }
          lastIdx = match.index + match[0].length;
        }
        if (lastIdx < cleaned.length) {
          segments.push({ type: 'prose', content: cleaned.slice(lastIdx) });
        }

        const renderProseParagraphs = (proseText, segKey) => {
          const lines = proseText.split('\n');
          const elements = [];
          let i = 0;

          while (i < lines.length) {
            const line = lines[i];
            const trimmed = line.trim();

            if (!trimmed) {
              i++;
              continue;
            }

            if (/^(?:---+|\*\*\*+|___+)$/.test(trimmed)) {
              elements.push(
                <hr
                  key={`${segKey}-hr-${i}`}
                  style={{
                    border: 'none',
                    borderTop: '1px solid #27272a',
                    margin: '10px 0',
                  }}
                />
              );
              i++;
              continue;
            }

            if (trimmed.startsWith('$$') && trimmed.endsWith('$$') && trimmed.length > 4) {
              elements.push(
                <div
                  key={`${segKey}-mathblk-${i}`}
                  style={{
                    background: 'rgba(168, 85, 247, 0.12)',
                    border: '1px solid rgba(168, 85, 247, 0.32)',
                    borderRadius: 12,
                    padding: '10px 14px',
                    margin: '6px 0',
                    color: '#f3e8ff',
                    fontWeight: 600,
                    fontSize: 15.5,
                    textAlign: 'center',
                  }}
                >
                  {formatLatexMathString(trimmed)}
                </div>
              );
              i++;
              continue;
            }

            if (trimmed.startsWith('|') && i + 1 < lines.length && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
              const headerCells = trimmed
                .split('|')
                .slice(1, -1)
                .map((c) => c.trim());
              i += 2;
              const rows = [];
              while (i < lines.length && lines[i].trim().startsWith('|')) {
                rows.push(
                  lines[i]
                    .trim()
                    .split('|')
                    .slice(1, -1)
                    .map((c) => c.trim())
                );
                i++;
              }
              elements.push(
                <div key={`${segKey}-tbl-${i}`} style={{ overflowX: 'auto' }}>
                  <table className="cm-table">
                    <thead>
                      <tr>
                        {headerCells.map((hc, ci) => (
                          <th key={ci}>{renderInlineFormatting(hc)}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((r, ri) => (
                        <tr key={ri}>
                          {r.map((cell, ci) => (
                            <td key={ci}>{renderInlineFormatting(cell)}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
              continue;
            }

            if (/^####\s+/.test(trimmed)) {
              elements.push(
                <h4 key={`${segKey}-h4-${i}`} style={{ fontSize: 15.5, fontWeight: 700, color: '#f4f4f5', marginTop: 10, marginBottom: 4 }}>
                  {renderInlineFormatting(trimmed.replace(/^####\s+/, ''))}
                </h4>
              );
              i++;
              continue;
            }
            if (/^###\s+/.test(trimmed)) {
              elements.push(
                <h3 key={`${segKey}-h3-${i}`} style={{ fontSize: 16.5, fontWeight: 700, color: '#ffffff', marginTop: 12, marginBottom: 4 }}>
                  {renderInlineFormatting(trimmed.replace(/^###\s+/, ''))}
                </h3>
              );
              i++;
              continue;
            }
            if (/^##\s+/.test(trimmed)) {
              elements.push(
                <h2 key={`${segKey}-h2-${i}`} style={{ fontSize: 18.5, fontWeight: 700, color: '#ffffff', marginTop: 14, marginBottom: 6 }}>
                  {renderInlineFormatting(trimmed.replace(/^##\s+/, ''))}
                </h2>
              );
              i++;
              continue;
            }
            if (/^#\s+/.test(trimmed)) {
              elements.push(
                <h1 key={`${segKey}-h1-${i}`} style={{ fontSize: 21, fontWeight: 700, color: '#ffffff', marginTop: 14, marginBottom: 6 }}>
                  {renderInlineFormatting(trimmed.replace(/^#\s+/, ''))}
                </h1>
              );
              i++;
              continue;
            }

            if (/^[-*•]\s+/.test(trimmed)) {
              const items = [];
              while (i < lines.length && /^[-*•]\s+/.test(lines[i].trim())) {
                items.push(lines[i].trim().replace(/^[-*•]\s+/, ''));
                i++;
              }
              elements.push(
                <ul key={`${segKey}-ul-${i}`} style={{ paddingLeft: 20, margin: '6px 0', display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {items.map((it, idx) => (
                    <li key={idx} style={{ fontSize: 15, lineHeight: 1.6, color: '#e4e4e7' }}>
                      {renderInlineFormatting(it)}
                    </li>
                  ))}
                </ul>
              );
              continue;
            }

            if (/^\d+\.\s+/.test(trimmed)) {
              const items = [];
              while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
                items.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
                i++;
              }
              elements.push(
                <ol key={`${segKey}-ol-${i}`} style={{ paddingLeft: 20, margin: '6px 0', display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {items.map((it, idx) => (
                    <li key={idx} style={{ fontSize: 15, lineHeight: 1.6, color: '#e4e4e7' }}>
                      {renderInlineFormatting(it)}
                    </li>
                  ))}
                </ol>
              );
              continue;
            }

            elements.push(
              <p key={`${segKey}-p-${i}`} style={{ fontSize: 15, lineHeight: 1.65, color: '#e4e4e7', margin: '4px 0' }}>
                {renderInlineFormatting(line)}
              </p>
            );
            i++;
          }

          return elements;
        };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {segments.map((seg, idx) => {
              if (seg.type === 'code') {
                return <ChatCodeBlock key={idx} lang={seg.lang} code={seg.content} onFixError={onFixError} />;
              }
              return <React.Fragment key={idx}>{renderProseParagraphs(seg.content, idx)}</React.Fragment>;
            })}
          </div>
        );
      }

      function ChatRichMessageContent({ text, onSelectOption, onFixError }) {
        const raw = String(text || '');
        const blocks = [];
        const specialBlockRegex =
          /<copy_block(?:\s+type\s*=\s*"([^"]*)")?(?:\s+title\s*=\s*"([^"]*)")?\s*>([\s\S]*?)(?:<\/copy_block>|$)|<ask_options(?:\s+question\s*=\s*"([^"]*)")?\s*>([\s\S]*?)(?:<\/ask_options>|$)/gi;

        let lastIdx = 0;
        let match;
        while ((match = specialBlockRegex.exec(raw)) !== null) {
          if (match.index > lastIdx) {
            const before = raw.slice(lastIdx, match.index).trim();
            if (before) blocks.push({ kind: 'markdown', text: before });
          }
          if (match[0].toLowerCase().startsWith('<ask_options')) {
            const question = match[4] || 'Choose the output:';
            const rawOpts = (match[5] || '')
              .split('\n')
              .map((l) => l.trim().replace(/^[-*•\d.)]+\s*/, ''))
              .filter(Boolean);
            blocks.push({
              kind: 'ask_options',
              question,
              options: rawOpts,
            });
          } else {
            blocks.push({
              kind: 'copy_block',
              blockType: match[1] || 'notes',
              title: match[2] || '',
              content: match[3] || '',
            });
          }
          lastIdx = match.index + match[0].length;
        }
        if (lastIdx < raw.length) {
          const rest = raw.slice(lastIdx).trim();
          if (rest) blocks.push({ kind: 'markdown', text: rest });
        }

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {blocks.map((b, idx) => {
              if (b.kind === 'ask_options') {
                return (
                  <ChatOptionsBlock
                    key={idx}
                    question={b.question}
                    options={b.options}
                    onSelectOption={onSelectOption}
                  />
                );
              }
              if (b.kind === 'copy_block') {
                return (
                  <ChatCopyableBlock
                    key={idx}
                    type={b.blockType}
                    title={b.title}
                    content={b.content}
                  />
                );
              }
              return <ChatMarkdownBody key={idx} text={b.text} onFixError={onFixError} />;
            })}
          </div>
        );
      }

      function ChatAIMessageCard({ msg, onRegenerate, onRegenerateImage, onSelectOption, onFixError }) {
        const [thoughtExpanded, setThoughtExpanded] = useState(false);
        const [copiedAll, setCopiedAll] = useState(false);

        return (
          <div className="cm-ai-surface fade-card">
            {(msg.thought || msg.running) && (
              <div className="cm-thought-card">
                <button
                  type="button"
                  className="cm-thought-header"
                  onClick={() => setThoughtExpanded((v) => !v)}
                >
                  <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                    {msg.running ? (
                      <span
