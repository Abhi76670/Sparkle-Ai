<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI App Builder</title>
    <meta name="description" content="Describe an app and let AI build a complete React project file by file with live thinking, live code, preview, terminal, and zip export." />
    <meta property="og:title" content="AI App Builder" />
    <meta property="og:description" content="Describe an app and let AI build a complete React project file by file with live thinking, live code, preview, terminal, and zip export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
    <style>
      @property --a {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      @keyframes rgbRotate {
        to {
          --a: 360deg;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes sheetSlideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      @keyframes backdropFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body, #root {
        width: 100%;
        height: 100%;
        background: #000000;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button, input, textarea {
        font-family: inherit;
        color: inherit;
      }

      /* Glowing rotating RGB border container */
      .rgb-box {
        position: relative;
        padding: 2px;
        border-radius: 18px;
        background: conic-gradient(from var(--a), red, yellow, green, cyan, blue, magenta, red);
        animation: rgbRotate 4s linear infinite;
        z-index: 1;
      }

      .rgb-box::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 20px;
        background: conic-gradient(from var(--a), red, yellow, green, cyan, blue, magenta, red);
        filter: blur(10px);
        opacity: 0.45;
        z-index: -1;
        animation: rgbRotate 4s linear infinite;
        pointer-events: none;
      }

      .rgb-inner {
        background: #141417;
        border-radius: 16px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Standard buttons */
      .btn {
        background: #212124;
        border: 1px solid #2e2e33;
        color: #f4f4f5;
        border-radius: 999px;
        min-height: 42px;
        padding: 0 16px;
        font-size: 14px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
        user-select: none;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: #2a2a2e;
        border-color: #3f3f46;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-main {
        background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
        color: #ffffff;
        border-color: transparent;
        font-weight: 600;
      }

      .btn-main:hover:not(:disabled) {
        background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%);
        border-color: transparent;
      }

      .btn-icon {
        min-width: 42px;
        padding: 0 10px;
      }

      /* Cards & Panels */
      .panel {
        background: #141417;
        border: 1px solid #27272a;
        border-radius: 20px;
      }

      .fade-card {
        animation: fadeSlideIn 0.24s ease-out both;
      }

      /* Spinner */
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #555;
        border-top-color: #e6e6e6;
        border-radius: 50%;
        display: inline-block;
        animation: spin 0.75s linear infinite;
        flex-shrink: 0;
      }

      /* Screens */
      .screen-center {
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .welcome-card {
        width: 100%;
        max-width: 420px;
        padding: 36px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        border-radius: 22px;
      }

      .home-container {
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px 0;
      }

      .prompt-textarea {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: #e6e6e6;
        font-size: 15px;
        line-height: 1.5;
        min-height: 96px;
      }

      .prompt-textarea::placeholder {
        color: #888;
      }

      /* Work Screen Layout */
      .work-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .topbar {
        height: 58px;
        background: #1d1d1d;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        gap: 8px;
        flex-shrink: 0;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }

      .project-title-input {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 15px;
        font-weight: 600;
        color: #e6e6e6;
        min-width: 90px;
        max-width: 240px;
        height: 40px;
        text-overflow: ellipsis;
      }

      .project-title-input:hover,
      .project-title-input:focus {
        border-color: #333;
        background: #262626;
        outline: none;
      }

      .topbar-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        background: #161616;
        padding: 4px;
        border-radius: 12px;
        border: 1px solid #2a2a2a;
      }

      .tab-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #888;
        border-radius: 10px;
        min-height: 38px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }

      .tab-btn:hover {
        color: #e6e6e6;
      }

      .tab-btn.active {
        background: #262626;
        color: #e6e6e6;
        border-color: #333;
      }

      .work-body {
        flex: 1;
        display: flex;
        min-height: 0;
        width: 100%;
        overflow: hidden;
      }

      .chat-col {
        width: 430px;
        flex-shrink: 0;
        border-right: 1px solid #2a2a2a;
        background: #161616;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }

      .main-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #161616;
      }

      @media (max-width: 799px) {
        .chat-col {
          width: 100%;
          border-right: none;
        }
        .mobile-hidden {
          display: none !important;
        }
        .tab-btn {
          min-height: 44px;
          padding: 0 11px;
        }
        .topbar {
          height: 62px;
          padding: 0 8px;
        }
        .project-title-input {
          max-width: 125px;
          font-size: 14px;
          padding: 4px 6px;
        }
      }

      /* Chat Messages */
      .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .user-bubble {
        align-self: flex-end;
        max-width: 88%;
        background: #262626;
        border: 1px solid #333;
        color: #e6e6e6;
        padding: 11px 15px;
        border-radius: 18px 18px 4px 18px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .ai-turn {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .trace-card {
        background: #1d1d1d;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        overflow: hidden;
      }

      .trace-header {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      .trace-header:hover {
        background: #242424;
      }

      .trace-body {
        padding: 10px 12px;
        border-top: 1px solid #2a2a2a;
        font-size: 12.5px;
        color: #888;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 260px;
        overflow-y: auto;
        background: #181818;
      }

      .file-row {
        min-height: 44px;
        padding: 8px 12px;
        background: #1d1d1d;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .file-row:hover {
        background: #252525;
      }

      .ai-reply {
        font-size: 14px;
        line-height: 1.6;
        color: #e6e6e6;
        white-space: pre-wrap;
        word-break: break-word;
        padding: 4px 2px;
      }

      .error-card {
        background: rgba(255, 82, 82, 0.1);
        border: 1px solid rgba(255, 82, 82, 0.45);
        border-radius: 14px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Preview & Terminal */
      .preview-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
        background: #161616;
      }

      .preview-iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: #ffffff;
      }

      .empty-preview {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 14px;
        padding: 24px;
        text-align: center;
      }

      .preview-wrap.preview-fullscreen {
        position: fixed !important;
        inset: 0 !important;
        z-index: 10000 !important;
        width: 100vw !important;
        height: 100dvh !important;
        min-height: 100dvh !important;
        background: #fff !important;
      }
      .preview-fullscreen .preview-iframe { flex: 1 1 auto; height: 100%; min-height: 0; }
      .preview-fullscreen .terminal-bar,
      .preview-fullscreen .terminal-drawer { display: none !important; }
      .preview-fullscreen-control {
        position: absolute; top: 12px; right: 12px; z-index: 3;
        min-height: 38px; padding: 0 13px; border-radius: 10px;
        border: 1px solid #d4d4d8; background: rgba(255,255,255,.94);
        color: #18181b; font-weight: 700; cursor: pointer;
        box-shadow: 0 4px 18px rgba(0,0,0,.12);
      }
      .cm-fullscreen-overlay {
        position: fixed; inset: 0; z-index: 10001; background: #09090b;
        display: flex; flex-direction: column; min-height: 0;
      }
      .cm-fullscreen-toolbar {
        flex: 0 0 auto; min-height: 54px; display: flex; align-items: center;
        justify-content: space-between; gap: 10px; padding: 8px 14px;
        border-bottom: 1px solid #303038; background: #151519; color: #fafafa;
      }
      .cm-fullscreen-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
      .cm-fullscreen-body pre { margin: 0; padding: 18px; min-height: 100%; white-space: pre; overflow: auto; color: #e4e4e7; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .cm-fullscreen-body iframe { width: 100%; height: 100%; min-height: 100%; border: 0; display: block; background: #fff; }

      .terminal-bar {
        min-height: 44px;
        background: #1d1d1d;
        border-top: 1px solid #2a2a2a;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
      }

      .terminal-bar:hover {
        background: #232323;
      }

      .terminal-drawer {
        height: 230px;
        background: #141414;
        border-top: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .terminal-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* Code View */
      .code-chips-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #1d1d1d;
        border-bottom: 1px solid #2a2a2a;
        overflow-x: auto;
        flex-shrink: 0;
      }

      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #262626;
        border: 1px solid #333;
        color: #888;
        border-radius: 10px;
        min-height: 38px;
        padding: 0 10px;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .file-chip.active {
        color: #e6e6e6;
        border-color: #666;
        background: #303030;
      }

      .chip-del {
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        line-height: 1;
        font-size: 12px;
      }

      .chip-del:hover {
        color: #ff5252;
        background: rgba(255, 82, 82, 0.15);
      }

      .code-editor-pane {
        flex: 1;
        overflow: auto;
        padding: 16px;
        background: #141414;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        color: #e6e6e6;
        white-space: pre;
        tab-size: 2;
      }

      /* Bottom Sheet Model Picker */
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        animation: backdropFadeIn 0.2s ease-out;
      }

      .sheet-panel {
        width: 100%;
        max-width: 560px;
        max-height: 82vh;
        background: #1d1d1d;
        border: 1px solid #2a2a2a;
        border-bottom: none;
        border-radius: 22px 22px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: sheetSlideUp 0.28s ease-out;
      }

      .grab-handle {
        width: 42px;
        height: 5px;
        background: #444;
        border-radius: 999px;
        margin: 10px auto 6px;
        flex-shrink: 0;
      }

      .sheet-search {
        margin: 8px 16px 12px;
        background: #161616;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 0 14px;
        height: 44px;
        color: #e6e6e6;
        font-size: 14px;
        outline: none;
      }

      .sheet-search:focus {
        border-color: #555;
      }

      .sheet-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .model-group-title {
        font-size: 11.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #888;
        margin-bottom: 6px;
        padding: 0 4px;
      }

      .model-item {
        width: 100%;
        min-height: 52px;
        padding: 8px 12px;
        background: #262626;
        border: 1px solid #333;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
        margin-bottom: 6px;
      }

      .model-item:hover {
        background: #2e2e2e;
      }

      .model-item.selected {
        border-color: #3ddc84;
        background: rgba(61, 220, 132, 0.08);
      }

      .star-btn {
        min-width: 44px;
        min-height: 44px;
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #666;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }

      .star-btn.fav {
        color: #facc15;
      }

      .star-btn:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      /* ==========================================================================
         CHAT MODE — CLEAN PITCH-BLACK AGENT THEME (.cm-*)
         ========================================================================== */
      @keyframes cmPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.92); }
      }

      @keyframes cmShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .cm-root {
        width: 100%;
        height: 100%;
        background: #000000;
        color: #f4f4f5;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .cm-header {
        height: 60px;
        background: #000000;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-shrink: 0;
        z-index: 20;
      }

      .cm-circle-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #212124;
        border: 1px solid #2e2e33;
        color: #f4f4f5;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        flex-shrink: 0;
      }

      .cm-circle-btn:hover {
        background: #2c2c30;
      }

      .cm-circle-btn:active {
        transform: scale(0.95);
      }

      .cm-btn {
        min-height: 36px;
        padding: 0 13px;
        border-radius: 999px;
        border: 1px solid #2e2e33;
        background: #1c1c1f;
        color: #e4e4e7;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }

      .cm-btn:hover:not(:disabled) {
        background: #27272a;
        border-color: #3f3f46;
      }

      .cm-btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .cm-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .cm-btn-gradient {
        background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
        color: #ffffff;
        border: none;
      }

      .cm-btn-gradient:hover:not(:disabled) {
        background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%);
      }

      .cm-btn-run {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        border: none;
      }

      .cm-btn-stop {
        background: #ef4444;
        color: #ffffff;
        border: none;
      }

      .cm-layout {
        flex: 1;
        display: flex;
        min-height: 0;
        position: relative;
        background: #000000;
      }

      .cm-sidebar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 40;
        animation: backdropFadeIn 0.18s ease-out;
      }

      .cm-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        max-width: 82vw;
        background: #121214;
        border-right: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        gap: 10px;
        overflow-y: auto;
        z-index: 50;
      }

      .cm-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: #000000;
      }

      .cm-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 8px;
        display: flex;
        flex-direction: column;
      }

      .cm-messages-inner {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .cm-empty-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: 14px;
      }

      .cm-quick-list {
        display: flex;
        flex-direction: column;

    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      const STORAGE_KEYS = {
        PROJECTS: 'aib_projects',
        MODEL: 'aib_model',
        FAV: 'aib_fav',
      };

      const DEFAULT_NVIDIA_FILTER_REGEX = /deepseek|nemotron|glm|kimi|moonshot|minimax|qwen|llama|mistral|gpt-oss|gemma/i;

      function safeReadStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed ?? fallback;
        } catch {
          return fallback;
        }
      }

      function safeWriteStorage(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch {
          // ignore quota errors
        }
      }

      function splitModelDisplay(fullId) {
        if (!fullId) return { shortName: 'gemini-3.8-flash', org: 'google' };
        const raw = fullId.startsWith('nvidia:') ? fullId.slice(7) : fullId;
        if (raw.includes('/')) {
          const idx = raw.indexOf('/');
          return {
            org: raw.slice(0, idx),
            shortName: raw.slice(idx + 1),
          };
        }
        return {
          org: 'google',
          shortName: raw,
        };
      }

      function deriveProjectName(promptText) {
        const cleaned = String(promptText || '')
          .replace(/<[^>]+>/g, ' ')
          .replace(/[`"'*_#]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!cleaned) return 'Untitled Project';

        const isNotes = /\b(notes?|summary|summarize|study guide|cheat sheet|revision)\b/i.test(cleaned);
        const isImage =
          /\b(image|img|photo|picture|pic|illustration|artwork|wallpaper|poster|logo)\b/i.test(cleaned);
        const isMath =
          /\b(solve|calculate|formula|equation|surface area|volume|integral|derivative)\b/i.test(cleaned);

        const stripped = cleaned
          .replace(
            /^(?:please\s+|can you\s+|could you\s+|i want(?:\s+you)?\s+to\s+|help me\s+)?(?:build|create|craete|make|design|develop|write|generate|genrate|genrateion|genration|draw|show|solve|explain|give me|prepare)\s+(?:me\s+)?(?:a\s+|an\s+|the\s+|some\s+)?(?:modern\s+|simple\s+|clean\s+|complete\s+|full\s+|beautiful\s+)?(?:notes?\s+(?:on|for|about)\s+|image\s+of\s+|picture\s+of\s+|photo\s+of\s+|app\s+for\s+|website\s+for\s+)?/i,
            ''
          )
          .replace(/\s+(?:app|application|website|web\s+app|in\s+html.*|using\s+react.*)$/i, '')
          .trim();

        const stopWords = new Set([
          'a',
          'an',
          'the',
          'and',
          'or',
          'of',
          'for',
          'in',
          'on',
          'to',
          'with',
          'by',
          'at',
          'from',
        ]);

        const rawWords = (stripped || cleaned)
          .replace(/[^a-zA-Z0-9&\s-]/g, ' ')
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 4);

        if (rawWords.length === 0) return 'Untitled Project';

        const titled = rawWords
          .map((w, idx) => {
            const lower = w.toLowerCase();
            if (idx > 0 && stopWords.has(lower)) return lower;
            if (/^(ui|ai|api|css|js|html|crm|erp|pos|3d|2d|vr|ar)$/i.test(w)) {
              return w.toUpperCase();
            }
            return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
          })
          .join(' ');

        if (isNotes && !/notes/i.test(titled) && rawWords.length <= 3) {
          return `${titled} Notes`;
        }
        if (isImage && !/image|photo|art/i.test(titled) && rawWords.length <= 3) {
          return `${titled} Image`;
        }
        if (isMath && !/math|solver|notes/i.test(titled) && rawWords.length <= 3) {
          return `${titled} Solution`;
        }
        return titled;
      }

      const SUPERSCRIPT_MAP = {
        '0': '⁰',
        '1': '¹',
        '2': '²',
        '3': '³',
        '4': '⁴',
        '5': '⁵',
        '6': '⁶',
        '7': '⁷',
        '8': '⁸',
        '9': '⁹',
        '+': '⁺',
        '-': '⁻',
        '=': '⁼',
        '(': '⁽',
        ')': '⁾',
        n: 'ⁿ',
        i: 'ⁱ',
        x: 'ˣ',
        y: 'ʸ',
        a: 'ᵃ',
        b: 'ᵇ',
        c: 'ᶜ',
        d: 'ᵈ',
        e: 'ᵉ',
        f: 'ᶠ',
        g: 'ᵍ',
        h: 'ʰ',
        k: 'ᵏ',
        m: 'ᵐ',
        o: 'ᵒ',
        p: 'ᵖ',
        r: 'ʳ',
        s: 'ˢ',
        t: 'ᵗ',
        u: 'ᵘ',
        v: 'ᵛ',
        w: 'ʷ',
        z: 'ᶻ',
      };

      const SUBSCRIPT_MAP = {
        '0': '₀',
        '1': '₁',
        '2': '₂',
        '3': '₃',
        '4': '₄',
        '5': '₅',
        '6': '₆',

        '+': '₊',

        o: 'ₒ',
        p: 'ₚ',
        r: 'ᵣ',
        s: 'ₛ',

        x: 'ₓ',
      };

      function toUnicodeSup(str) {
        const chars = String(str || '').split('');
        if (chars.every((c) => SUPERSCRIPT_MAP[c])) {
          return chars.map((c) => SUPERSCRIPT_MAP[c]).join('');
        }
        return `^(${str})`;
      }

      function toUnicodeSub(str) {
        const chars = String(str || '').split('');
        if (chars.every((c) => SUBSCRIPT_MAP[c])) {
          return chars.map((c) => SUBSCRIPT_MAP[c]).join('');
        }
        return `_${str}`;
      }

      function formatLatexMathString(rawStr) {
        if (!rawStr) return '';
        let s = String(rawStr)
          .replace(/^\$\$|\$\$$/g, '')
          .replace(/^\$|\$$/g, '')
          .replace(/^\\\[|\\\]$/g, '')
          .replace(/^\\\(|\\\)$/g, '');

        // Unwrap \text{...}, \mathrm{...}, \mathbf{...}, \textbf{...}, \mathit{...}
        for (let pass = 0; pass < 3; pass++) {
          s = s.replace(/\\(?:text|mathrm|mathbf|textbf|mathit|textit|mathsf|operatorname)\s*\{([^{}]*)\}/g, '$1');
        }

        // Convert \frac{a}{b} (support nested up to 2 passes)
        for (let pass = 0; pass < 2; pass++) {
          s = s.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, (_m, num, den) => {
            const n = num.trim();
            const d = den.trim();
            if (/^[0-9a-zA-Z]+$/.test(n) && /^[0-9a-zA-Z]+$/.test(d)) {
              return `(${n}/${d})`;
            }
            return `(${n}) / (${d})`;
          });
        }

        // Convert \sqrt[n]{x} and \sqrt{x}
        s = s.replace(/\\sqrt\s*\[([^\]]+)\]\s*\{([^{}]+)\}/g, (_m, root, inner) => {
          return `${toUnicodeSup(root.trim())}√(${inner.trim()})`;
        });
        s = s.replace(/\\sqrt\s*\{([^{}]+)\}/g, (_m, inner) => {
          const clean = inner.trim();
          return /^[0-9a-zA-Z]+$/.test(clean) ? `√${clean}` : `√(${clean})`;
        });

        // Common LaTeX symbols & Greek letters
        const latexReplacements = [
          [/\\times\b/g, ' × '],
          [/\\div\b/g, ' ÷ '],
          [/\\cdot\b/g, ' · '],
          [/\\pm\b/g, ' ± '],
          [/\\mp\b/g, ' ∓ '],
          [/\\leq?\b/g, ' ≤ '],
          [/\\geq?\b/g, ' ≥ '],
          [/\\neq?\b/g, ' ≠ '],
          [/\\approx\b/g, ' ≈ '],
          [/\\equiv\b/g, ' ≡ '],
          [/\\propto\b/g, ' ∝ '],
          [/\\infty\b/g, '∞'],
          [/\\rightarrow\b|\\to\b/g, ' → '],
          [/\\Rightarrow\b/g, ' ⇒ '],
          [/\\leftarrow\b/g, ' ← '],
          [/\\leftrightarrow\b/g, ' ↔ '],
          [/\\pi\b/g, 'π'],
          [/\\theta\b/g, 'θ'],
          [/\\alpha\b/g, 'α'],
          [/\\beta\b/g, 'β'],
          [/\\gamma\b/g, 'γ'],
          [/\\delta\b/g, 'δ'],
          [/\\Delta\b/g, 'Δ'],
          [/\\lambda\b/g, 'λ'],
          [/\\mu\b/g, 'μ'],
          [/\\sigma\b/g, 'σ'],
          [/\\Sigma\b|\\sum\b/g, '∑'],
          [/\\prod\b/g, '∏'],
          [/\\int\b/g, '∫'],
          [/\\omega\b/g, 'ω'],
          [/\\Omega\b/g, 'Ω'],
          [/\\phi\b|\\varphi\b/g, 'φ'],
          [/\\rho\b/g, 'ρ'],
          [/\\tau\b/g, 'τ'],
          [/\\partial\b/g, '∂'],
          [/\\nabla\b/g, '∇'],
          [/\^\\circ\b|\\degree\b|\\circ\b/g, '°'],
          [/\\angle\b/g, '∠'],
          [/\\perp\b/g, '⊥'],
          [/\\parallel\b/g, '∥'],
          [/\\triangle\b/g, '△'],
          [/\\left\s*([([\]{}|])/g, '$1'],
          [/\\right\s*([([\]{}|])/g, '$1'],
          [/\\[,;:!]|\\quad\b|\\qquad\b/g, ' '],
          [/\\{/g, '{'],
          [/\\}/g, '}'],
          [/\\%/g, '%'],
        ];

        for (const [re, rep] of latexReplacements) {
          s = s.replace(re, rep);
        }

        // Convert superscripts ^{...} and ^x
        s = s.replace(/\^\s*\{([^{}]+)\}/g, (_m, exp) => toUnicodeSup(exp.trim()));
        s = s.replace(/\^([0-9+\-=nxyabcdeghkmoprstuvwz])/g, (_m, ch) => toUnicodeSup(ch));

        // Convert subscripts _{...} and _x
        s = s.replace(/_\s*\{([^{}]+)\}/g, (_m, sub) => toUnicodeSub(sub.trim()));
        s = s.replace(/_([0-9+\-=aehijklmnoprstuvx])/g, (_m, ch) => toUnicodeSub(ch));

        // Strip any remaining stray LaTeX backslash commands while keeping words
        s = s.replace(/\\([a-zA-Z]+)/g, '$1');
        // Clean up extra spaces around parentheses or units
        s = s.replace(/\s+/g, ' ').trim();
        return s;
      }

      function normalizePlainMathCopyText(rawText) {
        return String(rawText || '')
          .replace(/\$\$([\s\S]*?)\$\$/g, (_m, inner) => formatLatexMathString(inner))
          .replace(/\$([^$\n]+)\$/g, (_m, inner) => formatLatexMathString(inner));
      }

      function extractBoldHeading(thoughtText) {
        if (!thoughtText) return '';
        const regex = /\*\*([^*\n]{2,80})\*\*/g;
        let match;
        let last = '';
        while ((match = regex.exec(thoughtText)) !== null) {
          const clean = match[1].trim();
          if (clean) last = clean;
        }
        return last;
      }

      // Page builder for both Preview (forPreview = true) and Standalone ZIP (forPreview = false)
      function buildProjectHtml(files, forPreview) {
        files = { ...(files || {}) };
        if (forPreview && files['package.json']) {
          try {
            const pkg = JSON.parse(files['package.json']);
            const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            if (deps.vite || deps.next || deps['react-scripts']) {
              return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101114;color:#f5f5f5;font:14px system-ui;padding:24px;box-sizing:border-box}.card{max-width:560px;border:1px solid #30323a;border-radius:18px;background:#191b21;padding:26px;line-height:1.65}.muted{color:#a1a1aa}code{color:#93c5fd;background:#252833;padding:3px 6px;border-radius:6px}</style></head><body><div class="card"><h2>Framework preview required</h2><p>This project uses a build framework (${deps.next ? 'Next.js' : deps.vite ? 'Vite' : 'React Scripts'}). The current instant preview supports browser-ready React/JS projects, not a running framework dev server.</p><p class="muted">Use the Build Mode terminal to install dependencies, run the project build/type-check, and review the exact output. The source files remain available in the Code tab and ZIP export.</p><p><code>npm install</code> → <code>npm run dev</code> / <code>npm run build</code></p></div></body></html>`;
            }
          } catch (_) {}
        }
        // Generated raster assets are stored as base64 markers in project state and
        // converted to data URLs only for the in-browser preview.
        Object.entries(files).forEach(([assetPath, raw]) => {
          if (typeof raw !== 'string' || !raw.startsWith('__AIB_BINARY_BASE64__:')) return;
          const dataUrl = `data:image/png;base64,${raw.slice('__AIB_BINARY_BASE64__:'.length)}`;
          Object.keys(files).forEach((sourcePath) => {
            if (sourcePath === assetPath || typeof files[sourcePath] !== 'string') return;
            files[sourcePath] = files[sourcePath]
              .split(assetPath).join(dataUrl)
              .split('/' + assetPath).join(dataUrl)
              .split('./' + assetPath).join(dataUrl);
          });
        });
        const allPaths = Object.keys(files || {});
        const cssPaths = allPaths.filter((p) => /\.css$/i.test(p)).sort();
        const jsPaths = allPaths
          .filter((p) => /\.(jsx|js)$/i.test(p) && !p.startsWith('node_modules/') && p !== 'vite.config.js' && p !== 'next.config.js')
          .sort((a, b) => {
            const aIsApp = /(^|\/)App\.jsx$/i.test(a);
            const bIsApp = /(^|\/)App\.jsx$/i.test(b);
            if (aIsApp && !bIsApp) return 1;
            if (!aIsApp && bIsApp) return -1;
            return a.localeCompare(b);
          });

        const combinedCss = cssPaths.map((p) => `/* ${p} */\n${files[p] || ''}`).join('\n\n');

        const previewScript = forPreview
          ? `<script>
(function() {
  function formatArg(a) {
    if (typeof a === 'string') return a;
    if (a instanceof Error) return a.message || String(a);
    try {
      return JSON.stringify(a);

      return String(a);
    }
  }
  function sendLog(lv, args) {
    try {
      var msg = Array.prototype.slice.call(args).map(formatArg).join(' ');
      window.parent.postMessage({ t: "log", lv: lv, msg: msg }, "*");
    } catch (e) {}
  }
  ['log', 'info', 'warn', 'error'].forEach(function(lv) {
    var orig = console[lv] ? console[lv].bind(console) : function(){};
    console[lv] = function() {
      sendLog(lv, arguments);
      orig.apply(console, arguments);
    };
  });
  window.onerror = function(message, source, lineno, colno) {
    var loc = (lineno || colno) ? " (line " + (lineno || 0) + ":" + (colno || 0) + ")" : "";
    sendLog("error", [String(message) + loc]);
    return false;
  };
  window.addEventListener("unhandledrejection", function(e) {
    var reason = e && e.reason ? (e.reason.message || String(e.reason)) : "Unhandled promise rejection";
    sendLog("error", [reason]);

  document.addEventListener("click", function(e) {
    if (e.defaultPrevented) return;

    if (!href || href.startsWith("#")) {
      e.preventDefault();
      var id = href.slice(1);
      if (!id || id === "top") {

        var el = document.getElementById(id);
        if (el && el.scrollIntoView) {
          el.scrollIntoView({ behavior: "smooth" });

      }
      return;
    }
    if (/^(https?:|mailto:|tel:)/i.test(href)) {
      e.preventDefault();

    e.preventDefault();
    console.warn("Blocked relative navigation inside preview: " + href);
  }, false);
  document.addEventListener("submit", function(e) {
    if (!e.defaultPrevented) {
      e.preventDefault();
      console.warn("Form submit intercepted in preview (prevented page reload).");
    }
  }, false);
})();
<\/script>`
          : '';

        const scriptTags = jsPaths

${combinedCss}

</head>

  <script type="text/babel" data-presets="react">
    (function() {

        constructor(props) {
