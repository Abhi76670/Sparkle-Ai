                      />
                    ) : (
                      <span style={{ color: '#3ddc84', fontWeight: 700 }}>✓</span>
                    )}
                    <span style={{ fontWeight: 500, color: '#d4d4d8', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {heading}
                    </span>
                  </span>
                  <span style={{ fontSize: 11.5, color: '#71717a' }}>
                    {thoughtExpanded ? '▴' : '▾'}
                  </span>
                </button>

                {thoughtExpanded && msg.thought && (
                  <div className="cm-thought-body">{msg.thought}</div>
                )}
              </div>
            )}

            {msg.plan && <details className="cm-thought-card" open><summary className="cm-thought-header">Gemini plan · {msg.plan.goal || 'Request plan'}</summary><div className="cm-thought-body"><ol>{(msg.plan.steps || []).map((step, i) => <li key={i}>{step}</li>)}</ol>{msg.plan.instructions}</div></details>}
            {msg.text && <ChatRichMessageContent text={msg.text} onSelectOption={onSelectOption} onFixError={onFixError} />}

            {msg.imageLoading && (
              <div
                style={{
                  padding: 18,
                  borderRadius: 16,
                  border: '1px solid #27272a',
                  background: '#141417',
                  color: '#d4d4d8',
                  fontSize: 13.5,
                  textAlign: 'center',
                }}
              >
                Creating image with NVIDIA NIM (nvidia/flux.2-klein-4b)...
              </div>
            )}

            {Array.isArray(msg.images) &&
              msg.images.map((imgItem, idx) => (
                <ChatImageCard
                  key={idx}
                  imgItem={imgItem}
                  onRegenerateImage={onRegenerateImage}
                />
              ))}

            {msg.error && (
              <div
                style={{
                  background: 'rgba(239, 68, 68, 0.12)',
                  border: '1px solid rgba(239, 68, 68, 0.35)',
                  color: '#fca5a5',
                  padding: '10px 14px',
                  borderRadius: 12,
                  fontSize: 13.5,
                }}
              >
                {msg.error}
              </div>
            )}

            {!msg.running && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingTop: 4 }}>
                <button
                  type="button"
                  className="cm-btn"
                  style={{ minHeight: 30, padding: '0 10px', fontSize: 12 }}
                  onClick={() => {
                    copyTextToClipboard(msg.text || '', () => {
                      setCopiedAll(true);
                      setTimeout(() => setCopiedAll(false), 1800);
                    });
                  }}
                >
                  {copiedAll ? '✓ Copied' : 'Copy'}
                </button>

                <button
                  type="button"
                  className="cm-btn"
                  style={{ minHeight: 30, padding: '0 10px', fontSize: 12 }}
                  onClick={onRegenerate}
                >
                  Regenerate
                </button>
              </div>
            )}
          </div>
        );
      }

      const CHAT_SESSIONS_KEY = 'aib_chat_sessions';

      function ChatModeView({ selectedModel, onSelectModel, plannerModel, onSelectPlannerModel, nvidiaModels = [], onSwitchToBuild }) {
        const chatRunModel = selectedModel || 'gemini-3.8-flash';
        const [chatModelSheetOpen, setChatModelSheetOpen] = useState(false);
        const [chatModelTarget, setChatModelTarget] = useState('run');

        const initialFreshChatId = useMemo(() => `cs_${Date.now()}`, []);

        const [sessions, setSessions] = useState(() => {
          const saved = safeReadStorage(CHAT_SESSIONS_KEY, []);
          const pastNonEmpty = Array.isArray(saved)
            ? saved.filter((s) => Array.isArray(s.messages) && s.messages.length > 0)
            : [];
          return [
            {
              id: initialFreshChatId,
              title: 'New Chat',
              messages: [],
            },
            ...pastNonEmpty,
          ];
        });

        const [activeSessionId, setActiveSessionId] = useState(initialFreshChatId);

        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [plusMenuOpen, setPlusMenuOpen] = useState(false);
        const [input, setInput] = useState('');
        const [chatAttachments, setChatAttachments] = useState([]);
        const [aspectRatio, setAspectRatio] = useState('16:9');
        const [imageModel, setImageModelState] = useState(() => { try { return localStorage.getItem('aib_image_model') || 'gemini'; } catch { return 'gemini'; } });
        const setImageModel = (v) => { setImageModelState(v); try { localStorage.setItem('aib_image_model', v); } catch {} };
        const [forceImageMode, setForceImageMode] = useState(false);
        const [streaming, setStreaming] = useState(false);

        const abortControllerRef = useRef(null);
        const fileInputRef = useRef(null);
        const inputRef = useRef(null);
        const scrollRef = useRef(null);

        useEffect(() => {
          safeWriteStorage(CHAT_SESSIONS_KEY, sessions);
        }, [sessions]);

        const currentSession = useMemo(() => {
          return sessions.find((s) => s.id === activeSessionId) || sessions[0] || null;
        }, [sessions, activeSessionId]);

        useEffect(() => {
          if (currentSession && currentSession.id !== activeSessionId) {
            setActiveSessionId(currentSession.id);
          }
        }, [currentSession, activeSessionId]);

        useEffect(() => {
          if (scrollRef.current) {
            scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
          }
        }, [currentSession?.messages]);

        const handleUploadImages = (e) => {
          const files = Array.from(e.target.files || []);
          files.forEach((f) => {
            const reader = new FileReader();
            reader.onload = () => {
              setChatAttachments((prev) => [
                ...prev,
                {
                  name: f.name,
                  mimeType: f.type || 'image/png',
                  data: String(reader.result || ''),
                },
              ]);
            };
            reader.readAsDataURL(f);
          });
          e.target.value = '';
          setPlusMenuOpen(false);
        };

        const handleStopGeneration = () => {
          if (abortControllerRef.current) {
            abortControllerRef.current.abort();
            abortControllerRef.current = null;
          }
          setStreaming(false);
          if (currentSession) {
            setSessions((prev) =>
              prev.map((s) =>
                s.id !== currentSession.id
                  ? s
                  : {
                      ...s,
                      messages: (s.messages || []).map((m) =>
                        m.running ? { ...m, running: false, imageLoading: null } : m
                      ),
                    }
              )
            );
          }
        };

        const sendMessageToGemini = async (promptText, atts = [], customHistory = null) => {
          if (!currentSession || streaming) return;
          const cleanText = String(promptText || '').trim();
          if (!cleanText && atts.length === 0) return;

          const sessId = currentSession.id;
          const baseHistory = customHistory !== null ? customHistory : currentSession.messages || [];

          const userMsg = {
            id: `cu_${Date.now()}`,
            role: 'user',
            text: cleanText,
            attachments: atts,
          };

          const aiMsgId = `cai_${Date.now() + 1}`;
          const aiMsg = {
            id: aiMsgId,
            plan: null,
            role: 'ai',
            running: true,
            thought: '',
            heading: 'Thinking...',
            text: '',
            images: [],
            imageLoading: null,
            error: '',
          };

          const nextMessages = [...baseHistory, userMsg, aiMsg];
          setSessions((prev) =>
            prev.map((s) => {
              if (s.id !== sessId) return s;
              const newTitle =
                !s.title || s.title === 'New Chat' || s.title === 'New Gemini Chat'
                  ? deriveProjectName(cleanText || 'Image')
                  : s.title;
              return { ...s, title: newTitle, messages: nextMessages };
            })
          );

          setStreaming(true);
          const controller = new AbortController();
          abortControllerRef.current = controller;

          let thoughtAcc = '';
          let headingAcc = 'Thinking...';
          let textAcc = '';
          let imagesAcc = [];
          let imgLoadingState = null;
          let errorAcc = '';
          let planAcc = null;

          const syncAiMsg = (stillRunning) => {
            setSessions((prev) =>
              prev.map((s) => {
                if (s.id !== sessId) return s;
                return {
                  ...s,
                  messages: (s.messages || []).map((m) =>
                    m.id !== aiMsgId
                      ? m
                      : {
                          ...m,
                          running: stillRunning,
                          thought: thoughtAcc,
                          heading: headingAcc,
                          text: textAcc,
                          images: [...imagesAcc],
                          imageLoading: imgLoadingState,
                          error: errorAcc,
                          plan: planAcc,
                        }
                  ),
                };
              })
            );
          };

          try {
            const apiMessages = [...baseHistory, userMsg].map((m) => ({
              role: m.role,
              text: m.text || '',
              attachments: m.attachments,
            }));

            const resp = await fetch('/api/chat/stream', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: chatRunModel,
                plannerModel,
                messages: apiMessages,
                attachments: atts,
                aspectRatio,
                imageModel,
                forceImage: forceImageMode,
              }),
              signal: controller.signal,
            });

            if (!resp.ok || !resp.body) {
              throw new Error(`HTTP ${resp.status}`);
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let sseBuf = '';

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              sseBuf += decoder.decode(value, { stream: true });
              const lines = sseBuf.split('\n');
              sseBuf = lines.pop() || '';

              for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line.startsWith('data:')) continue;
                const jsonStr = line.slice(5).trim();
                if (!jsonStr) continue;
                let ev;
                try {
                  ev = JSON.parse(jsonStr);
                } catch {
                  continue;
                }

                if (ev.type === 'plan') {
                  planAcc = ev.plan || null;
                  syncAiMsg(true);
                } else if (ev.type === 'thought') {
                  thoughtAcc += ev.text || '';
                  if (ev.heading) headingAcc = ev.heading;
                  syncAiMsg(true);
                } else if (ev.type === 'project_name' && ev.name) {
                  setSessions((prev) =>
                    prev.map((s) =>
                      s.id === sessId ? { ...s, title: String(ev.name).trim() } : s
                    )
                  );
                } else if (ev.type === 'text') {
                  textAcc += ev.text || '';
                  syncAiMsg(true);
                } else if (ev.type === 'image_start') {
                  imgLoadingState = { prompt: ev.prompt, aspectRatio: ev.aspectRatio };
                  syncAiMsg(true);
                } else if (ev.type === 'image') {
                  imgLoadingState = null;
                  imagesAcc.push({
                    url: ev.url,
                    prompt: ev.prompt,
                    aspectRatio: ev.aspectRatio,
                    model: ev.model,
                  });
                  syncAiMsg(true);
                } else if (ev.type === 'error') {
                  errorAcc = ev.message || 'Chat error occurred.';
                  syncAiMsg(true);
                } else if (ev.type === 'done') {
                  imgLoadingState = null;
                  syncAiMsg(false);
                }
              }
            }
          } catch (err) {
            if (err.name !== 'AbortError') {
              errorAcc = String(err.message || err);
            }
          } finally {
            imgLoadingState = null;
            syncAiMsg(false);
            setStreaming(false);
            setForceImageMode(false);
            abortControllerRef.current = null;
          }
        };

        const handleRegenerateTurn = (aiMsgIndex) => {
          if (!currentSession || streaming) return;
          const msgs = currentSession.messages || [];
          const userMsgIndex = aiMsgIndex - 1;
          if (userMsgIndex < 0 || msgs[userMsgIndex]?.role !== 'user') return;
          const targetUserMsg = msgs[userMsgIndex];
          const historyBefore = msgs.slice(0, userMsgIndex);
          sendMessageToGemini(targetUserMsg.text, targetUserMsg.attachments || [], historyBefore);
        };

        const handleRegenerateImageOnMsg = async (msgId, prompt, newRatio, imodel) => {
          const resp = await fetch('/api/chat/image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, aspectRatio: newRatio, imageModel: imodel }),
          });
          const data = await resp.json();
          if (!resp.ok || !data.url) {
            throw new Error(data.error || 'Failed to regenerate image');
          }
          setSessions((prev) =>
            prev.map((s) => {
              if (s.id !== currentSession.id) return s;
              return {
                ...s,
                messages: (s.messages || []).map((m) =>
                  m.id !== msgId
                    ? m
                    : {
                        ...m,
                        images: [
                          {
                            url: data.url,
                            prompt,
                            aspectRatio: data.aspectRatio || newRatio,
                            model: data.model,
                            note: data.note,
                          },
                        ],
                      }
                ),
              };
            })
          );
        };

        const handleCreateNewChat = () => {
          const newChat = {
            id: `cs_${Date.now()}`,
            title: 'New Chat',
            messages: [],
          };
          setSessions((prev) => [newChat, ...prev]);
          setActiveSessionId(newChat.id);
          setSidebarOpen(false);
        };

        const handleFixChatCodeError = (errorText, codeText) => {
          if (streaming) return;
          const fixPrompt = `The HTML/CSS/JavaScript code you just provided has a runtime error in the built-in preview. Fix the exact error below. Return the complete corrected single-file HTML document, preserve the current design and all working features, do not remove functionality to hide the error, and ensure it runs in a normal browser sandbox.

Runtime error:
${errorText}

Current code:
${codeText}`;
          sendMessageToGemini(fixPrompt, []);
        };

        const handleSubmitInput = () => {
          if (streaming) {
            handleStopGeneration();
            return;
          }
          if (!input.trim() && chatAttachments.length === 0) return;
          const t = input;
          const a = [...chatAttachments];
          setInput('');
          setChatAttachments([]);
          sendMessageToGemini(t, a);
        };

        return (
          <div className="cm-root">
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              multiple
              style={{ display: 'none' }}
              onChange={handleUploadImages}
            />

            {/* Clean Top Bar matching user screenshot (NO Get Plus, NO telemetry text) */}
            <header className="cm-header">
              <button
                type="button"
                className="cm-circle-btn"
                onClick={() => setSidebarOpen((v) => !v)}
                aria-label="Menu"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                  <line x1="4" y1="9" x2="20" y2="9" />
                  <line x1="4" y1="15" x2="14" y2="15" />
                </svg>
              </button>

              <div style={{display:'flex',gap:6,alignItems:'center',minWidth:0,overflowX:'auto'}}>
                <button type="button" className="cm-btn" style={{whiteSpace:'nowrap'}} onClick={()=>{setChatModelTarget('planner');setChatModelSheetOpen(true);}}>Planner · {String(plannerModel || 'gemini-3.8-flash').startsWith('nvidia:') ? splitModelDisplay(plannerModel).shortName : String(plannerModel || 'gemini-3.8-flash').replace('gemini-','Gemini ')} ⌄</button>
                <button type="button" className="cm-btn" style={{whiteSpace:'nowrap'}} onClick={()=>{setChatModelTarget('run');setChatModelSheetOpen(true);}}>Run · {String(chatRunModel).startsWith('nvidia:') ? String(chatRunModel).slice(7).split('/').pop() : String(chatRunModel).replace('gemini-','Gemini ')} ⌄</button>
              </div>
              <button
                type="button"
                className="cm-circle-btn"
                onClick={handleCreateNewChat}
                aria-label="New chat"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 12a9 9 0 1 1-3.2-6.9" strokeDasharray="3 2" />
                  <path d="M12 8v8M8 12h8" />
                </svg>
              </button>
            </header>

            <div className="cm-layout">
              {sidebarOpen && (
                <>
                  <div className="cm-sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
                  <aside className="cm-sidebar">
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontWeight: 600, fontSize: 14, color: '#f4f4f5' }}>Chats</span>
                      <button
                        type="button"
                        className="cm-btn"
                        onClick={handleCreateNewChat}
                      >
                        + New
                      </button>
                    </div>

                    <button
                      type="button"
                      className="cm-btn"
                      style={{ width: '100%', justifyContent: 'flex-start', marginBottom: 6 }}
                      onClick={() => {
                        setSidebarOpen(false);
                        onSwitchToBuild();
                      }}
                    >
                      ← Switch to App Builder
                    </button>

                    <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {sessions.map((s) => (
                        <div
                          key={s.id}
                          onClick={() => {
                            setActiveSessionId(s.id);
                            setSidebarOpen(false);
                          }}
                          style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'space-between',
                            padding: '10px 12px',
                            borderRadius: 12,
                            background: s.id === currentSession?.id ? '#27272a' : 'transparent',
                            cursor: 'pointer',
                            fontSize: 13.5,
                            color: '#f4f4f5',
                          }}
                        >
                          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {s.title || 'New Chat'}
                          </span>
                          {sessions.length > 1 && (
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                setSessions((prev) => prev.filter((item) => item.id !== s.id));
                              }}
                              style={{
                                border: 'none',
                                background: 'transparent',
                                color: '#71717a',
                                cursor: 'pointer',
                              }}
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </aside>
                </>
              )}

              <main className="cm-main">
                <div className="cm-messages" ref={scrollRef}>
                  <div className="cm-messages-inner">
                    {(currentSession?.messages || []).length === 0 ? (
                      <div className="cm-empty-wrap">
                        <div className="cm-quick-list">
                          <button
                            type="button"
                            className="cm-quick-row"
                            onClick={() => {
                              setForceImageMode(true);
                              setInput('Create an image of ');
                              inputRef.current?.focus();
                            }}
                          >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
                              <rect x="3" y="3" width="18" height="18" rx="3" />
                              <circle cx="8.5" cy="8.5" r="1.5" />
                              <path d="M21 15l-5-5L5 21" />
                            </svg>
                            <span>Create an image</span>
                          </button>

                          <button
                            type="button"
                            className="cm-quick-row"
                            onClick={() => {
                              setForceImageMode(false);
                              setInput('Write or edit ');
                              inputRef.current?.focus();
                            }}
                          >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                            </svg>
                            <span>Write or edit</span>
                          </button>

                          <button
                            type="button"
                            className="cm-quick-row"
                            onClick={() => {
                              setForceImageMode(false);
                              setInput('Search and explain ');
                              inputRef.current?.focus();
                            }}
                          >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
                              <circle cx="12" cy="12" r="10" />
                              <line x1="2" y1="12" x2="22" y2="12" />
                              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                            </svg>
                            <span>Search the web</span>
                          </button>
                        </div>
                      </div>
                    ) : (
                      (currentSession?.messages || []).map((m, idx) =>
                        m.role === 'user' ? (
                          <div key={m.id} className="cm-user-bubble fade-card">
                            <div>{m.text}</div>
                            {Array.isArray(m.attachments) && m.attachments.length > 0 && (
                              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 10 }}>
                                {m.attachments.map((att, ai) => (
                                  <img
                                    key={ai}
                                    src={att.data}
                                    alt={att.name || 'Uploaded'}
                                    style={{
                                      width: 80,
                                      height: 80,
                                      objectFit: 'cover',
                                      borderRadius: 10,
                                    }}
                                  />
                                ))}
                              </div>
                            )}
                          </div>
                        ) : (
                          <ChatAIMessageCard
                            key={m.id}
                            msg={m}
                            onRegenerate={() => handleRegenerateTurn(idx)}
                            onRegenerateImage={(p, r, im) => handleRegenerateImageOnMsg(m.id, p, r, im)}
                            onSelectOption={(optText) => sendMessageToGemini(optText, [])}
                            onFixError={handleFixChatCodeError}
                          />
                        )
                      )
                    )}
                  </div>
                </div>

                {/* Clean Pill Composer matching user screenshot */}
                <div className="cm-composer-wrap">
                  <div className="cm-composer-inner">
                    {plusMenuOpen && (
                      <div
                        style={{
                          position: 'absolute',
                          bottom: 'calc(100% + 10px)',
                          left: 0,
                          background: '#1c1c1f',
                          border: '1px solid #2e2e33',
                          borderRadius: 18,
                          padding: 8,
                          display: 'flex',
                          flexDirection: 'column',
                          gap: 4,
                          minWidth: 210,
                          zIndex: 30,
                          boxShadow: '0 10px 28px rgba(0,0,0,0.6)',
                        }}
                      >
                        <button
                          type="button"
                          className="cm-btn"
                          style={{ justifyContent: 'flex-start', border: 'none', background: 'transparent' }}
                          onClick={() => fileInputRef.current?.click()}
                        >
                          🖼 Upload image
                        </button>
                        <button
                          type="button"
                          className="cm-btn"
                          style={{
                            justifyContent: 'flex-start',
                            border: 'none',
                            background: forceImageMode ? '#2e1065' : 'transparent',
                          }}
                          onClick={() => {
                            setForceImageMode((v) => !v);
                            setPlusMenuOpen(false);
                          }}
                        >
                          🎨 {forceImageMode ? 'Image mode: ON' : 'Create an image'}
                        </button>
                        <div style={{ display: 'flex', gap: 4, padding: '4px 6px' }}>
                          {['1:1', '16:9', '9:16'].map((r) => (
                            <button
                              key={r}
                              type="button"
                              onClick={() => {
                                setAspectRatio(r);
                                setPlusMenuOpen(false);
                              }}
                              style={{
                                flex: 1,
                                padding: '5px 0',
                                borderRadius: 8,
                                border: '1px solid #2e2e33',
                                background: aspectRatio === r ? '#a855f7' : '#141417',
                                color: '#fff',
                                fontSize: 11.5,
                                cursor: 'pointer',
                              }}
                            >
                              {r}
                            </button>
                          ))}
                        </div>
                        <div style={{ display: 'flex', gap: 4, padding: '0 6px 6px' }}>
                          {[['gemini', 'Gemini'], ['flux', 'Flux Klein'], ['nvidia', 'NVIDIA auto']].map(([k, l]) => (
                            <button
                              key={k}
                              type="button"
                              onClick={() => { setImageModel(k); setPlusMenuOpen(false); }}
                              style={{ flex: 1, padding: '5px 0', borderRadius: 8, border: '1px solid #2e2e33', background: imageModel === k ? '#a855f7' : '#141417', color: '#fff', fontSize: 11.5, cursor: 'pointer' }}
                            >
                              {l}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {chatAttachments.length > 0 && (
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 8 }}>
                        {chatAttachments.map((att, idx) => (
                          <div
                            key={idx}
                            style={{
                              display: 'inline-flex',
                              alignItems: 'center',
                              gap: 6,
                              background: '#1c1c1f',
                              border: '1px solid #2e2e33',
                              borderRadius: 12,
                              padding: '4px 8px',
                              fontSize: 12,
                            }}
                          >
                            <img
                              src={att.data}
                              alt={att.name}
                              style={{ width: 26, height: 26, objectFit: 'cover', borderRadius: 6 }}
                            />
                            <button
                              type="button"
                              onClick={() =>
                                setChatAttachments((prev) => prev.filter((_, i) => i !== idx))
                              }
                              style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#a1a1aa' }}
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="cm-pill-bar">
                      <button
                        type="button"
                        className="cm-pill-icon-btn"
                        onClick={() => setPlusMenuOpen((v) => !v)}
                        aria-label="Add attachment or option"
                      >
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                          <line x1="12" y1="5" x2="12" y2="19" />
                          <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                      </button>

                      <textarea
                        ref={inputRef}
                        rows={1}
                        className="cm-pill-input"
                        placeholder={forceImageMode ? 'Describe the image to create...' : 'Ask anything'}
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            handleSubmitInput();
                          }
                        }}
                      />

                      <button
                        type="button"
                        className="cm-pill-icon-btn"
                        onClick={() => inputRef.current?.focus()}
                        aria-label="Voice input"
                      >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                          <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                      </button>

                      <button
                        type="button"
                        className="cm-pill-action-btn"
                        onClick={handleSubmitInput}
                        aria-label={streaming ? 'Stop' : 'Send'}
                      >
                        {streaming ? (
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                          </svg>
                        ) : input.trim() || chatAttachments.length > 0 ? (
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5" />
                            <polyline points="5 12 12 5 19 12" />
                          </svg>
                        ) : (
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                            <line x1="6" y1="10" x2="6" y2="14" />
                            <line x1="10" y1="6" x2="10" y2="18" />
                            <line x1="14" y1="8" x2="14" y2="16" />
                            <line x1="18" y1="11" x2="18" y2="13" />
                          </svg>
                        )}
                      </button>
                    </div>
                  </div>
                </div>
              </main>
            </div>
          <ModelPickerSheet
            open={chatModelSheetOpen}
            onClose={() => setChatModelSheetOpen(false)}
            selectedModel={chatModelTarget === 'planner' ? plannerModel : chatRunModel}
            onSelectModel={onSelectModel}
            selectionTarget={chatModelTarget}
            onTargetChange={setChatModelTarget}
            selectedPlannerModel={plannerModel}
            onSelectPlannerModel={onSelectPlannerModel}
            favorites={[]}
            onToggleFavorite={() => {}}
            nvidiaModels={nvidiaModels}
          />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
